<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Point Residences — Resident Portal Demo</title>
<meta name="description" content="Demo resident services portal for a fictional condominium: store, reservations, feedback, AI concierge and management dashboard.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --navy:#0e2a3b;--navy-2:#163b52;--sea:#2a7f86;--sea-soft:#d7ecec;--sand:#f4efe6;--sand-2:#e9e1d2;
  --coral:#e0704f;--coral-d:#c45a3b;--ink:#1b2328;--muted:#5f6c73;--line:#ddd5c6;--white:#fff;
  --ok:#2f8a5b;--warn:#c98a1d;--bad:#c2463d;
  --serif:"DM Serif Display",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --r:14px;--shadow:0 10px 30px rgba(14,42,59,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--sand);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

/* demo banner + nav */
.demo-banner{background:var(--coral);color:#fff;text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.04em;padding:6px 12px}
.demo-banner button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:99px;padding:2px 10px;margin-left:10px;cursor:pointer;font-weight:700;font-size:12px}
.nav{position:sticky;top:0;z-index:40;background:rgba(244,239,230,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand-mark{width:38px;height:38px}
.brand{white-space:nowrap}.brand b{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.links a{text-decoration:none;padding:8px 12px;border-radius:99px;font-weight:600;font-size:14px;color:var(--navy)}
.links a:hover{background:var(--sand-2)}
.links a.active{background:var(--navy);color:#fff}
.nav-tools{display:flex;gap:8px;align-items:center}
.pill-btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pill-btn:hover{border-color:var(--navy)}
.cart-count{background:var(--coral);color:#fff;border-radius:99px;font-size:11px;min-width:19px;height:19px;display:inline-grid;place-items:center;padding:0 5px}
.menu-btn{display:none}
@media (max-width:960px){
  .links{display:none;position:absolute;top:100%;left:0;right:0;background:var(--sand);flex-direction:column;padding:10px 16px 16px;border-bottom:1px solid var(--line)}
  .links.open{display:flex}
  .menu-btn{display:inline-flex}
  .nav-in{position:relative}
  .nav-tools{margin-left:auto}
}
@media (max-width:560px){#cartBtnLabel,.lang-label{display:none}.brand small{display:none}.brand b{font-size:18px}.nav-in{gap:10px;padding:10px 14px}.pill-btn{flex-shrink:0;padding:7px 10px}.hero{min-height:560px}}

/* layout */
main{min-height:70vh}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.section{padding:64px 0}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--sea);font-weight:800}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--navy);margin:0}
h1{font-size:clamp(38px,6vw,72px);line-height:1.02}
h2{font-size:clamp(28px,3.6vw,42px);line-height:1.1}
h3{font-size:22px}
.lead{font-size:17px;color:var(--muted);max-width:620px}
.page-head{padding-top:48px;padding-bottom:24px}
.page-head p{color:var(--muted);max-width:640px;margin:10px 0 0}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.hr{height:1px;background:var(--line);margin:16px 0}

/* buttons */
.btn{border:0;border-radius:99px;padding:12px 22px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:14px;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--coral);color:#fff}.btn-primary:hover{background:var(--coral-d)}
.btn-dark{background:var(--navy);color:#fff}.btn-dark:hover{background:var(--navy-2)}
.btn-ghost{background:transparent;border:1.5px solid currentColor;color:var(--navy)}
.btn-light{background:#fff;color:var(--navy)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-danger{background:#fbe7e5;color:var(--bad)}
.btn-ok{background:#e3f2ea;color:var(--ok)}

/* hero */
.hero{position:relative;min-height:620px;overflow:hidden;color:#fff;display:flex;align-items:center}
.hero-art{position:absolute;inset:0}
.hero-art svg{width:100%;height:100%}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,42,59,.85),rgba(14,42,59,.35) 60%,rgba(14,42,59,.05))}
.hero-in{position:relative;max-width:1200px;margin:0 auto;padding:80px 20px;width:100%}
.hero h1{color:#fff;max-width:720px}
.hero p{font-size:18px;max-width:520px;opacity:.9;margin:20px 0 30px}
.wave{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.hero-stats{display:flex;gap:28px;margin-top:44px;flex-wrap:wrap}
.hero-stats div b{display:block;font-family:var(--serif);font-size:30px;font-weight:400}
.hero-stats div span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}

.svc{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;transition:.2s;position:relative;overflow:hidden}
.svc:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--sea)}
.svc .ico{width:46px;height:46px;border-radius:12px;background:var(--sea-soft);display:grid;place-items:center;margin-bottom:16px;color:var(--sea)}
.svc h3{font-size:21px;margin-bottom:6px}
.svc p{margin:0;color:var(--muted);font-size:14px}
.svc .go{position:absolute;right:20px;top:24px;color:var(--coral);font-weight:800}
.notice{display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-bottom:1px solid var(--line)}
.notice:last-child{border-bottom:0}
.notice time{flex:0 0 64px;text-align:center;background:var(--sand);border-radius:10px;padding:8px 0;font-weight:800;color:var(--navy);line-height:1.1}
.notice time small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
.band{background:var(--navy);color:#fff}
.band h2{color:#fff}
.band .muted{color:#b9c7cf}

/* lifestyle */
.gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:200px;gap:12px}
.gallery button{border:0;padding:0;border-radius:12px;overflow:hidden;cursor:zoom-in;position:relative;background:var(--navy)}
.gallery button svg{width:100%;height:100%;transition:transform .5s}
.gallery button:hover svg{transform:scale(1.05)}
.gallery button span{position:absolute;left:12px;bottom:10px;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.gallery .wide{grid-column:span 2}.gallery .tall{grid-row:span 2}
@media (max-width:800px){.gallery{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px}}
.video{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/8;background:#0b2230}
.video .scene{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
.video .scene.on{opacity:1}
.video .scene svg{width:100%;height:100%}
.video .vcap{position:absolute;left:24px;bottom:22px;color:#fff;font-family:var(--serif);font-size:clamp(20px,3vw,32px);text-shadow:0 2px 12px rgba(0,0,0,.4)}
.video .vplay{position:absolute;right:20px;bottom:20px}
.video .vbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.15)}
.video .vbar i{display:block;height:100%;width:0;background:var(--coral);transition:width .3s linear}
.lightbox{position:fixed;inset:0;background:rgba(6,18,26,.92);z-index:90;display:none;align-items:center;justify-content:center;padding:30px}
.lightbox.open{display:flex}
.lightbox .lb-img{width:min(1000px,100%);aspect-ratio:3/2;border-radius:14px;overflow:hidden}
.lightbox .lb-img svg{width:100%;height:100%}
.lightbox .lb-cap{color:#fff;text-align:center;margin-top:14px;font-weight:700}
.lb-btn{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;width:48px;height:48px;border-radius:99px;font-size:22px;cursor:pointer}
.lb-prev{left:18px;top:50%}.lb-next{right:18px;top:50%}.lb-close{right:18px;top:18px}

/* store */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px}
.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:13.5px}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.product{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.product .pimg{height:150px;position:relative}
.product .pimg svg{width:100%;height:100%}
.product .badge{position:absolute;top:10px;left:10px}
.product .pbody{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.product h3{font-size:19px}
.product p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.price{font-weight:800;font-size:18px;color:var(--navy)}
.badge{display:inline-flex;align-items:center;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:800;letter-spacing:.02em}
.b-sea{background:var(--sea-soft);color:var(--sea)}.b-coral{background:#fbe3da;color:var(--coral-d)}.b-gray{background:#ece8e0;color:var(--muted)}
.b-ok{background:#e3f2ea;color:var(--ok)}.b-warn{background:#fbf0d9;color:#9a6a12}.b-bad{background:#fbe7e5;color:var(--bad)}.b-navy{background:var(--navy);color:#fff}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.qty button{border:0;background:#fff;width:32px;height:32px;cursor:pointer;font-weight:800}
.qty span{min-width:28px;text-align:center;font-weight:800}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;z-index:80;transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.drawer.open{transform:none}
.drawer-head{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer-body{padding:20px;overflow:auto;flex:1}
.drawer-foot{padding:20px;border-top:1px solid var(--line)}
.scrim{position:fixed;inset:0;background:rgba(6,18,26,.45);z-index:70;display:none}
.scrim.open{display:block}
.line-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line-item .li-name{flex:1;font-weight:700;font-size:14px}
.totals div{display:flex;justify-content:space-between;padding:4px 0}
.totals .grand{font-weight:800;font-size:18px;color:var(--navy);border-top:1px solid var(--line);margin-top:6px;padding-top:10px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:13px;color:var(--navy)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sea);outline:none}
.field textarea{min-height:120px;resize:vertical}
.field .err{color:var(--bad);font-size:12.5px;font-weight:600;display:none}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad)}
.field.invalid .err{display:block}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0;cursor:pointer}
.check input{margin-top:4px;width:17px;height:17px;accent-color:var(--coral)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.two{grid-template-columns:1fr}}
.alert{border-radius:12px;padding:14px 16px;font-size:14px;font-weight:600}
.alert-ok{background:#e3f2ea;color:#1f6b45}.alert-warn{background:#fbf0d9;color:#7d5610}.alert-bad{background:#fbe7e5;color:#9b2f27}.alert-info{background:var(--sea-soft);color:#1d5f64}
.checkout-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
@media (max-width:900px){.checkout-grid{grid-template-columns:1fr}}
.paybox{border:1.5px dashed var(--sea);border-radius:12px;padding:16px;background:#fbfdfd}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.opt.on{border-color:var(--coral);background:#fff8f5}
.opt input{accent-color:var(--coral);margin-top:4px}
.spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.success-mark{width:72px;height:72px;border-radius:50%;background:#e3f2ea;color:var(--ok);display:grid;place-items:center;margin:0 auto 18px}

/* reservations */
.amen{cursor:pointer;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--r);padding:0;overflow:hidden}
.amen.on{border-color:var(--coral);box-shadow:0 0 0 3px #fbe3da}
.amen .aimg{height:110px}.amen .aimg svg{width:100%;height:100%}
.amen .abody{padding:14px}
.amen h3{font-size:19px}
.cal{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid .dow{font-size:11px;text-align:center;color:var(--muted);font-weight:800;padding:4px 0}
.day{border:0;background:var(--sand);border-radius:8px;aspect-ratio:1;font-weight:700;cursor:pointer;font-size:14px;position:relative}
.day:hover:not(:disabled){background:var(--sea-soft)}
.day:disabled{background:transparent;color:#c2bbb0;cursor:not-allowed}
.day.sel{background:var(--navy);color:#fff}
.day.busy::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--coral)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.slot{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:700;cursor:pointer;font-size:13.5px}
.slot.on{border-color:var(--coral);background:#fff8f5}
.slot:disabled{background:#f1ede6;color:#b3ab9f;cursor:not-allowed;text-decoration:line-through}
.steps{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:800;padding:6px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps span.done{background:var(--sea-soft);color:var(--sea);border-color:var(--sea-soft)}
.res-card{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* chat */
.chat-fab{position:fixed;right:22px;bottom:22px;z-index:60;width:62px;height:62px;border-radius:50%;border:0;background:var(--navy);color:#fff;cursor:pointer;box-shadow:0 12px 30px rgba(14,42,59,.35);display:grid;place-items:center}
.chat-fab .dot{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.chat{position:fixed;right:22px;bottom:96px;z-index:61;width:min(380px,calc(100% - 28px));height:min(560px,calc(100vh - 130px));background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:none;flex-direction:column;overflow:hidden}
.chat.open{display:flex}
.chat-head{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.chat-head .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--sea),var(--coral));display:grid;place-items:center;font-family:var(--serif);font-size:18px}
.chat-head b{display:block}.chat-head small{opacity:.75}
.chat-head button{margin-left:auto;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.chat-body{flex:1;overflow:auto;padding:16px;background:var(--sand);display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:10px 13px;border-radius:14px;font-size:14px;white-space:pre-line}
.msg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{background:var(--sea);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.typing{color:var(--muted);font-style:italic}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat-form input{flex:1;border:1.5px solid var(--line);border-radius:99px;padding:10px 14px}
.chat-form button{border:0;background:var(--coral);color:#fff;border-radius:99px;padding:0 16px;font-weight:800;cursor:pointer}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:95;background:rgba(6,18,26,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal.open{display:flex}
.modal-card{background:#fff;border-radius:18px;width:min(720px,100%);padding:28px;position:relative}
.modal-card .x{position:absolute;right:16px;top:14px;border:0;background:none;font-size:24px;cursor:pointer;color:var(--muted)}
.doc{font-family:Georgia,serif;font-size:14px;line-height:1.6}
.doc h3{font-family:var(--serif)}
.doc table{width:100%;border-collapse:collapse;margin:10px 0}
.doc td,.doc th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.sig{font-family:"Brush Script MT","Segoe Script",cursive;font-size:28px;color:var(--navy);border-bottom:1px solid var(--ink);display:inline-block;min-width:240px;padding:0 6px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(200%);opacity:0;visibility:hidden;background:var(--navy);color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;z-index:99;transition:transform .3s;font-size:14px;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}

/* footer */
footer{background:var(--navy);color:#c5d2d9;padding:40px 0;margin-top:40px;font-size:14px}
footer b{color:#fff}

/* management */
.admin{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 100px)}
.admin aside{background:var(--navy);color:#cfdbe1;padding:20px 12px;position:sticky;top:0;height:calc(100vh - 30px);overflow:auto}
.admin aside .who{padding:10px 12px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.admin aside .who b{color:#fff;display:block}
.admin aside button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px}
.admin aside button:hover{background:rgba(255,255,255,.07)}
.admin aside button.on{background:#fff;color:var(--navy)}
.admin aside .cnt{background:var(--coral);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.admin .main{padding:28px;min-width:0}

/* ---------- storage (safe) ---------- */
const STORE_KEY = "hp-demo-v1";
const mem = {};
function load(key, fallback) {
  try { const raw = localStorage.getItem(`${STORE_KEY}:${key}`); if (raw) return JSON.parse(raw); } catch (_) {}
  return key in mem ? mem[key] : fallback;
}
function save(key, value) {
  mem[key] = value;
  try { localStorage.setItem(`${STORE_KEY}:${key}`, JSON.stringify(value)); } catch (_) {}
}
function wipe() {
  Object.keys(mem).forEach(k => delete mem[k]);
  try { Object.keys(localStorage).filter(k => k.startsWith(STORE_KEY)).forEach(k => localStorage.removeItem(k)); } catch (_) {}
}

function seedAll() {
  let s = 7; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  const pick = a => a[Math.floor(r() * a.length)];
  const person = i => { const f = FIRST[i % 20], l = LAST[(i * 7) % 20]; const unit = `${Math.floor(r() * 30) + 2}${pick(["01","02","05","08","10","12"])}`; return {name:`${f} ${l}`, unit, email:`${f.toLowerCase()}.${l.toLowerCase()}@example.com`, phone:`(555) 01${pad(Math.floor(r() * 90) + 10)}-${1000 + Math.floor(r() * 8999)}`}; };
  const now = new Date();
  const products = SEED_PRODUCTS.map(p => ({...p}));
  const sellable = products.filter(p => p.active && p.stock > 0);
  const statuses = ["Received","In Progress","Completed","Completed","Completed","Cancelled"];
  const orders = Array.from({length:24}, (_, i) => {
    const who = person(i); const n = 1 + Math.floor(r() * 2);
    const items = Array.from({length:n}, () => { const p = pick(sellable); return {id:p.id, name:p.name, qty:1 + Math.floor(r() * (p.recurring ? 1 : 2)), price:p.price, cat:p.cat}; });
    const sub = items.reduce((t, x) => t + x.price * x.qty, 0);
    const date = addDays(now, -Math.floor(r() * 150)); date.setHours(8 + Math.floor(r() * 10), Math.floor(r() * 60));
    const st = i < 4 ? "Received" : pick(statuses);
    return {number:orderNo(), ...who, items, subtotal:sub, fee:fee(sub), total:sub + fee(sub), status:st, payment:sub === 0 ? "No payment required" : st === "Cancelled" ? "Refunded" : "Paid", recurring:items.some(x => x.id === "p11") && r() > .4, date:date.toISOString(), note:st === "In Progress" ? "Technician scheduled." : "", internal:""};
  });
  const fbMsgs = ["The hallway light outside my unit has been flickering for a few days.","Front desk was super helpful with my delivery today, thank you!","Could we add more shaded seating at the pool?","Loud music after 11pm from the floor above on weekends.","The gym treadmill #2 is making a grinding noise.","Garage gate took a long time to open this morning.","Would love an EV charger in the guest garage.","Elevator B stops between floors occasionally.","Please remind residents to clean up after pets on the garden walk.","The package room was very organized this week. Great job."];
  const feedback = fbMsgs.map((m, i) => { const who = person(i + 3); const d = addDays(now, -Math.floor(r() * 40)); return {id:uid(), ...who, category:["Maintenance","Front Desk","Suggestion","Noise","Amenities","Security","Suggestion","Maintenance","Other","Front Desk"][i], message:m, status:i < 4 ? "New" : i < 7 ? "In Review" : "Completed", response:i >= 7 ? "Thank you, we've shared this with the team." : "", internal:"", date:d.toISOString()}; });
  const resStatuses = ["pending","approved","approved","deposit_paid","completed","declined"];
  const reservations = Array.from({length:12}, (_, i) => {
    const a = AMENITIES[i % 4]; const who = person(i + 8);
    const day = addDays(now, i < 8 ? 2 + Math.floor(r() * 26) : -Math.floor(r() * 30) - 1);
    const start = a.open + Math.floor(r() * Math.max(1, a.close - a.open - 3));
    const guests = 1 + Math.floor(r() * a.cap);
    const st = i >= 8 ? (i === 11 ? "declined" : "completed") : i < 3 ? "pending" : pick(resStatuses.slice(1, 4));
    return {id:uid(), ref:"R-" + (4100 + i), token:uid(), amenity:a.id, date:ymd(day), start, hours:a.id === "gym" ? 1 : 3, guests, ...who, status:st, fee:a.fee, deposit:depositFor(a, guests), depositStatus:st === "deposit_paid" || st === "completed" ? "held" : "none", created:addDays(now, -Math.floor(r() * 10) - 1).toISOString(), notes:i === 1 ? "Birthday celebration, will bring own decorations." : ""};
  });
  const chats = [
    {id:uid(), date:addDays(now, -1).toISOString(), lang:"en", status:"Unreviewed", messages:[{who:"me",text:"When is the pool open?"},{who:"bot",text:"The pool is open daily from 7:00 AM to 10:00 PM."},{who:"me",text:"Can I bring guests?"},{who:"bot",text:"Yes, up to 4 guests per unit. Guests must be accompanied by a resident."}]},
    {id:uid(), date:addDays(now, -2).toISOString(), lang:"es", status:"Reviewed", messages:[{who:"me",text:"¿Dónde recojo mis paquetes?"},{who:"bot",text:"Los paquetes se guardan en la sala de paquetes junto al lobby. Recibirá un aviso por correo cuando llegue uno."}]},
    {id:uid(), date:addDays(now, -4).toISOString(), lang:"en", status:"Needs follow-up", messages:[{who:"me",text:"My AC is leaking water on the floor"},{who:"bot",text:"Sorry about that! For active leaks, call the front desk right away at (555) 010-0199 so maintenance can respond. You can also book an AC service in the Resident Store."}]}
  ];
  const outbox = [];
  save("products", products); save("orders", orders); save("feedback", feedback);
  save("reservations", reservations); save("chats", chats); save("outbox", outbox);
  save("seeded", true);
}
function depositFor(a, guests) { const t = a.deposits.find(([lo, hi]) => guests >= lo && guests <= hi) || a.deposits[a.deposits.length - 1]; return t[2]; }

}

function maxQty(p) { return Math.min(p.recurring ? 1 : 10, p.stock); }
function addToCart(id) {
  const p = products().find(x => x.id === id); if (!p || p.stock <= 0) return;

function cartLines() { const ps = products(); return cart.map(l => ({...l, p:ps.find(x => x.id === l.id)})).filter(l => l.p && l.p.active && l.p.stock > 0); }
function cartTotals(recurringAuto = false) {

  return {lines, sub, fee:f, total:sub + f, monthly:monthly ? monthly + fee(monthly) : 0};
}

/* ---------- reservations ---------- */
const resState = {step:1, amenity:null, date:null, start:null, guests:2, notes:"", month:null, rules:false};
const myTokens = () => load("myReservations", []);
function reservationsFor(amenityId, date) { return load("reservations", []).filter(r => r.amenity === amenityId && r.date === date && !["declined","cancelled"].includes(r.status)); }
function slotTaken(a, date, start, hours) { return reservationsFor(a.id, date).some(r => start < r.start + r.hours && r.start < start + hours); }
function durationFor(a) { return a.id === "gym" ? 1 : 3; }
function pageReservations(v) {
  if (!resState.month) { const d = new Date(); resState.month = new Date(d.getFullYear(), d.getMonth(), 1); }

  const stepNames = ["step1","step2","step3","step4"];
  v.innerHTML = `<div class="wrap page-head"><div class="eyebrow">${esc(t("nav_res"))}</div><h1>${esc(t("res_title"))}</h1><p>${esc(t("res_sub"))}</p></div>
  <div class="wrap grid" style="grid-template-columns:minmax(0,1fr);gap:28px">
    <div><div class="steps">${stepNames.map((s, i) => `<span class="${i + 1 < resState.step ? "done" : i + 1 === resState.step ? "on" : ""}">${esc(t(s))}</span>`).join("")}</div><div id="resStep"></div></div>

      <div class="small"><b>${esc(t("capacity", {n:x.cap}))}</b> · ${esc(t("hours", {o:hourLabel(x.open), c:hourLabel(x.close)}))}</div>
      <div class="small muted">${esc(t("res_fee"))}: ${x.fee ? money(x.fee) : esc(t("none"))}</div></div></button>`).join("")}</div>`;
    $$("[data-am]", box).forEach(b => b.onclick = () => { resState.amenity = b.dataset.am; resState.date = null; resState.start = null; resState.step = 2; pageReservations(v); });
  } else if (resState.step === 2) {
    const m = resState.month; const first = new Date(m.getFullYear(), m.getMonth(), 1); const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    const minDate = addDays(new Date(), 1); minDate.setHours(0, 0, 0, 0); const maxDate = addDays(new Date(), 90);
    const dows = LANG === "es" ? ["D","L","M","M","J","V","S"] : ["S","M","T","W","T","F","S"];
    let cells = dows.map(d => `<div class="dow">${d}</div>`).join("") + Array(first.getDay()).fill("<div></div>").join("");
    for (let d = 1; d <= days; d++) { const dt = new Date(m.getFullYear(), m.getMonth(), d); const key = ymd(dt); const dis = dt < minDate || dt > maxDate; const busy = reservationsFor(a.id, key).length > 0;
      cells += `<button type="button" class="day ${resState.date === key ? "sel" : ""} ${busy && !dis ? "busy" : ""}" data-day="${key}" ${dis ? "disabled" : ""}>${d}</button>`; }
    const dur = durationFor(a);
    const slots = []; for (let h = a.open; h + dur <= a.close; h++) slots.push(h);
    box.innerHTML = `<div class="grid g2" style="align-items:start"><div class="cal"><div class="cal-head"><button class="pill-btn" type="button" id="prevM">‹</button><b>${esc(m.toLocaleDateString(LANG === "es" ? "es-US" : "en-US", {month:"long", year:"numeric"}))}</b><button class="pill-btn" type="button" id="nextM">›</button></div><div class="cal-grid">${cells}</div>
      <p class="small muted" style="margin:10px 0 0"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral)"></span> = existing bookings that day</p></div>
      <div class="card"><h3>${esc(aName(a))}</h3><p class="small muted">${esc(t("hours", {o:hourLabel(a.open), c:hourLabel(a.close)}))} · ${dur}h</p>
      ${resState.date ? `<b class="small">${esc(dateLabel(resState.date, {weekday:"long", month:"long", day:"numeric"}))}</b><div class="slots" style="margin-top:10px">${slots.map(h => { const taken = slotTaken(a, resState.date, h, dur); return `<button type="button" class="slot ${resState.start === h ? "on" : ""}" data-slot="${h}" ${taken ? `disabled title="${esc(t("booked"))}"` : ""}>${hourLabel(h)}</button>`; }).join("")}</div>` : `<p class="muted">${esc(t("pick_date"))}</p>`}
      <div class="row" style="margin-top:18px"><button class="btn btn-ghost btn-sm" type="button" id="back1">${esc(t("back"))}</button><button class="btn btn-primary btn-sm" type="button" id="next2" ${resState.start == null ? "disabled" : ""}>${esc(t("next"))}</button></div></div></div>`;
    $("#prevM").onclick = () => { resState.month = new Date(m.getFullYear(), m.getMonth() - 1, 1); pageReservations(v); };
    $("#nextM").onclick = () => { resState.month = new Date(m.getFullYear(), m.getMonth() + 1, 1); pageReservations(v); };

    $$("[data-slot]", box).forEach(b => b.onclick = () => { resState.start = +b.dataset.slot; pageReservations(v); });

      <div class="two"><div class="field"><label for="f-guests">${esc(t("guests"))}</label><input id="f-guests" type="number" min="1" max="${a.cap}" value="${Math.min(resState.guests, a.cap)}"><span class="small muted">${esc(t("capacity", {n:a.cap}))}</span></div>
      <div class="field"><label>${esc(t("deposit"))}</label><div id="depShow" class="price" style="padding:10px 0"></div></div></div>
      <div class="field"><label for="f-notes">${esc(t("notes"))}</label><textarea id="f-notes" maxlength="500">${esc(resState.notes)}</textarea></div>
      <div class="row"><button class="btn btn-ghost btn-sm" type="button" id="back2">${esc(t("back"))}</button><button class="btn btn-primary btn-sm" type="submit">${esc(t("next"))}</button></div></form>`;
    const showDep = () => { const g = Math.max(1, Math.min(a.cap, parseInt($("#f-guests").value, 10) || 1)); const d = depositFor(a, g); $("#depShow").textContent = d ? money(d) : t("none"); };
    showDep(); $("#f-guests").oninput = showDep;
    $("#back2").onclick = () => { resState.step = 2; pageReservations(v); };
    $("#resForm").onsubmit = e => { e.preventDefault(); const who = validResident(); if (!who) return; resState.who = who; resState.guests = Math.max(1, Math.min(a.cap, parseInt($("#f-guests").value, 10) || 1)); resState.notes = $("#f-notes").value.slice(0, 500); save("residentDraft", who); resState.step = 4; pageReservations(v); };
  } else {
    const dep = depositFor(a, resState.guests); const w = resState.who;
    box.innerHTML = `<div class="card" style="max-width:760px"><h3>${esc(aName(a))}</h3>
      <div class="facts"><div><span>${esc(t("pick_date"))}</span>${esc(dateLabel(resState.date, {weekday:"short", month:"short", day:"numeric", year:"numeric"}))}</div><div><span>${esc(t("pick_time"))}</span>${hourLabel(resState.start)} – ${hourLabel(resState.start + durationFor(a))}</div>
      <div><span>${esc(t("guests"))}</span>${resState.guests}</div><div><span>${esc(t("unit"))}</span>${esc(w.unit)} · ${esc(w.name)}</div>
      <div><span>${esc(t("res_fee"))}</span>${a.fee ? money(a.fee) : esc(t("none"))}</div><div><span>${esc(t("deposit"))}</span>${dep ? money(dep) : esc(t("none"))}</div></div>
      ${dep ? `<p class="small muted">${esc(t("deposit_note"))}</p>` : ""}
      <label class="check"><input type="checkbox" id="rulesOk"><span>${esc(t("rules"))}</span></label><div class="field" data-f="rules"><span class="err">${esc(t("err_terms"))}</span></div>
      <div class="row"><button class="btn btn-ghost btn-sm" type="button" id="back3">${esc(t("back"))}</button><button class="btn btn-primary" type="button" id="submitRes">${esc(t("submit_res"))}</button></div></div>`;
    $("#back3").onclick = () => { resState.step = 3; pageReservations(v); };
    $("#submitRes").onclick = () => {
      if (setErr("rules", !$("#rulesOk").checked)) return;
      if (slotTaken(a, resState.date, resState.start, durationFor(a))) { toast("That time was just booked. Please pick another."); resState.step = 2; return pageReservations(v); }
      const list = load("reservations", []);
      const ref = "R-" + (4100 + list.length + Math.floor(Math.random() * 800));
      const r = {id:uid(), ref, token:uid(), amenity:a.id, date:resState.date, start:resState.start, hours:durationFor(a), guests:resState.guests, ...w, status:"pending", fee:a.fee, deposit:dep, depositStatus:"none", created:new Date().toISOString(), notes:resState.notes};

      sendDemoEmail("management@harborpoint-demo.com", `New reservation request ${r.ref}`, `${r.name} (Unit ${r.unit}) requested the ${a.name}.\nDate: ${dateLabel(r.date)} ${hourLabel(r.start)}–${hourLabel(r.start + r.hours)}\nGuests: ${r.guests}\nNotes: ${r.notes || "—"}\n\nReview it in the Management dashboard.`, "Management");

function renderMyReservations(v) {

  const box = $("#myRes");
  if (!list.length) { box.innerHTML = `<div class="empty">${esc(t("no_res"))}</div>`; return; }
  box.innerHTML = `<div class="stack">${list.map(r => { const a = AMENITIES.find(x => x.id === r.amenity); const cls = {pending:"b-warn",approved:"b-coral",deposit_paid:"b-ok",completed:"b-gray",declined:"b-bad",cancelled:"b-gray"}[r.status];
    return `<div class="card res-card"><div><b>${esc(aName(a))}</b> <span class="badge ${cls}">${esc(t("r_" + r.status))}</span><div class="small muted">${esc(r.ref)} · ${esc(dateLabel(r.date))} · ${hourLabel(r.start)} · ${r.guests} ${esc(t("guests").toLowerCase())}</div></div>
    <div class="row">${r.status === "approved" && r.deposit ? `<button class="btn btn-primary btn-sm" type="button" data-dep="${r.id}">${esc(t("pay_deposit"))} · ${money(r.deposit)}</button>` : ""}${["pending","approved","deposit_paid"].includes(r.status) ? `<button class="btn btn-danger btn-sm" type="button" data-cx="${r.id}">${esc(t("cancel"))}</button>` : ""}</div></div>`; }).join("")}</div>`;
  $$("[data-cx]", box).forEach(b => b.onclick = () => { updateReservation(b.dataset.cx, r => { r.status = "cancelled"; if (r.depositStatus === "held") r.depositStatus = "released"; }); sendDemoEmail(list.find(x => x.id === b.dataset.cx).email, "Reservation cancelled", "Your reservation has been cancelled. Any deposit hold has been released."); toast(t("cancelled")); pageReservations(v); });
  $$("[data-dep]", box).forEach(b => b.onclick = () => depositCheckout(b.dataset.dep, v));
}
function updateReservation(id, fn) { const list = load("reservations", []); const r = list.find(x => x.id === id); if (r) { fn(r); save("reservations", list); } return r; }
function depositCheckout(id, v) {
  const r = load("reservations", []).find(x => x.id === id); const a = AMENITIES.find(x => x.id === r.amenity);
  openModal(`<h3>${esc(t("pay_deposit"))} · ${money(r.deposit)}</h3><p class="small muted">${esc(aName(a))} · ${esc(r.ref)} · ${esc(t("deposit_note"))}</p>
    <form id="depForm" novalidate><div class="alert alert-info small" style="margin-bottom:12px">${esc(t("test_card"))}</div>${field("card", t("card"), "text", "", "err_card", 'inputmode="numeric" placeholder="4242 4242 4242 4242" maxlength="19"')}

  $("#depForm").onsubmit = e => { e.preventDefault(); if (setErr("card", $("#f-card").value.replace(/\D/g, "") !== "4242424242424242")) return;

    closeModal(); toast(t("deposit_done")); pageReservations(v); };
}

let chatSession = null;
function chatAnswer(text) {
  const q = " " + text.toLowerCase() + " ";
  const spanish = LANG === "es" || /[¿¡ñ]|\b(donde|dónde|cuando|cuándo|cómo|como|quiero|puedo|tengo|hola|gracias|piscina|paquete)\b/.test(q);
  let best = null, score = 0;
  KB.forEach(e => { const s = e.k.reduce((a, k) => a + (q.includes(k) ? k.length : 0), 0); if (s > score) { score = s; best = e; } });
  if (best) return spanish ? best.es : best.en;
  return spanish ? "No tengo esa respuesta todavía. La recepción puede ayudarle 24/7 al (555) 010-0199, o envíe un mensaje en la página de Comentarios." : "I don't have that answer yet. The front desk can help 24/7 at (555) 010-0199, or send a note on the Feedback page.";
}
function renderChatChrome() {
  $("#chatName").textContent = t("chat_title"); $("#chatStatus").textContent = t("chat_status");
  $("#chatInput").placeholder = t("chat_ph");
  $("#chatChips").innerHTML = t("chips").map(c => `<button type="button">${esc(c)}</button>`).join("");
  $$("#chatChips button").forEach(b => b.onclick = () => chatSend(b.textContent));
  if (!$("#chatBody").children.length) chatBubble("bot", t("chat_hi"));
}
function chatBubble(who, text) { const d = document.createElement("div"); d.className = "msg " + who; d.textContent = text; $("#chatBody").appendChild(d); $("#chatBody").scrollTop = 1e6; return d; }
function openChat() { $("#chat").classList.add("open"); renderChatChrome(); setTimeout(() => $("#chatInput").focus(), 50); const dot = $(".chat-fab .dot"); if (dot) dot.remove(); }
function chatSend(text) {
  text = String(text || "").trim().slice(0, 500); if (!text) return;
  chatBubble("me", text); $("#chatInput").value = "";
  const typing = chatBubble("bot typing", "Aria is typing…");
  setTimeout(() => {
    typing.remove(); const answer = chatAnswer(text); chatBubble("bot", answer);
    const chats = load("chats", []);
    if (!chatSession) { chatSession = {id:uid(), date:new Date().toISOString(), lang:LANG, status:"Unreviewed", messages:[]}; chats.unshift(chatSession); }
    const s = chats.find(c => c.id === chatSession.id) || chatSession; if (!chats.includes(s)) chats.unshift(s);
    s.messages.push({who:"me", text}, {who:"bot", text:answer}); chatSession = s; save("chats", chats.slice(0, 100));
  }, 650);
}

  $("#pForm").onsubmit = e => { e.preventDefault(); const name = $("#pe-name").value.trim(); const price = Math.round(parseFloat($("#pe-price").value || "0") * 100); const stock = Math.max(0, Math.min(99, parseInt($("#pe-stock").value, 10) || 0));
    if (!name || price < 0) { $("#pe-err").innerHTML = `<div class="alert alert-bad small" style="margin-bottom:10px">Enter a name and a valid price.</div>`; return; }
    const list = load("products", []); const ex = list.find(x => x.id === p.id); const upd = {...p, name, es:$("#pe-es").value.trim(), desc:$("#pe-desc").value.trim(), cat:$("#pe-cat").value, price, stock, img};
    if (ex) Object.assign(ex, upd); else list.push(upd);
    try { save("products", list); } catch (_) {}
    closeModal(); toast("Product saved"); pageManagement(v); };
  const del = $("#pe-del"); if (del) del.onclick = () => { closeModal(); askConfirm(`Delete "${p.name}"? It will be removed from the store.`, () => { save("products", load("products", []).filter(x => x.id !== p.id)); toast("Product deleted"); pageManagement(v); }); };
}

/* reservations */
function adminReservations(m, v) {
  const all = load("reservations", []).slice().sort((a, b) => (a.date + pad(a.start)).localeCompare(b.date + pad(b.start)));
  const list = resFilter === "all" ? all : all.filter(r => r.status === resFilter);
  const sel = all.find(r => r.id === selRes);
  const filters = [["pending","Pending"],["approved","Deposit due"],["deposit_paid","Confirmed"],["completed","Completed"],["declined","Declined"],["cancelled","Cancelled"],["all","All"]];
  m.innerHTML = `<h2>Reservations</h2><div class="tabs" style="margin-top:14px">${filters.map(([k, l]) => `<button type="button" class="tab ${resFilter === k ? "on" : ""}" data-rf="${k}">${l} <span class="small">(${k === "all" ? all.length : all.filter(r => r.status === k).length})</span></button>`).join("")}<button class="btn btn-primary btn-sm" id="rCal" type="button" style="margin-left:auto">${icon("cal", 14)} Calendar view</button></div>
    <div class="split"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ref</th><th>Amenity</th><th>When</th><th>Resident</th><th>Status</th></tr></thead><tbody>
    ${list.map(r => `<tr class="click ${r.id === selRes ? "sel" : ""}" data-r="${r.id}"><td><b>${esc(r.ref)}</b></td><td>${esc(AMENITIES.find(a => a.id === r.amenity).name)}</td><td>${esc(dateLabel(r.date))}<div class="small muted">${hourLabel(r.start)}–${hourLabel(r.start + r.hours)}</div></td><td>${esc(r.name)}<div class="small muted">Unit ${esc(r.unit)} · ${r.guests} guests</div></td><td><span class="badge ${RES_CLS[r.status]}">${RES_LABEL[r.status]}</span></td></tr>`).join("") || `<tr><td colspan="5" class="muted">Nothing here.</td></tr>`}
    </tbody></table></div><div class="detail">${sel ? resDetail(sel) : `<div class="empty">Select a reservation to approve, decline or manage the deposit.</div>`}</div></div>`;
  $$("[data-rf]", m).forEach(b => b.onclick = () => { resFilter = b.dataset.rf; adminReservations(m, v); });
  $$("[data-r]", m).forEach(r => r.onclick = () => { selRes = r.dataset.r; adminReservations(m, v); });
  $("#rCal").onclick = () => resCalendar();
  if (!sel) return;
  const a = AMENITIES.find(x => x.id === sel.amenity);
  const act = (fn, msg, mail) => { updateReservation(sel.id, fn); if (mail) sendDemoEmail(sel.email, mail[0], mail[1]); toast(msg); pageManagement(v); };
  const on = (idSel, f) => { const el = $(idSel); if (el) el.onclick = f; };
  on("#rApprove", () => act(r => { r.status = sel.deposit ? "approved" : "deposit_paid"; }, "Reservation approved", [`Reservation ${sel.ref} approved`, `Good news, ${sel.name}! Your ${a.name} reservation on ${dateLabel(sel.date)} at ${hourLabel(sel.start)} is approved.${sel.deposit ? `\n\nPlease authorize your refundable ${money(sel.deposit)} deposit here: (secure deposit link)\nIn the demo: Reservations page → My reservations → Authorize deposit.` : ""}`]));
  on("#rDecline", () => askConfirm(`Decline ${sel.ref}?`, () => act(r => { r.status = "declined"; }, "Reservation declined", [`Reservation ${sel.ref} declined`, `Sorry, ${sel.name}, we can't accommodate your ${a.name} request on ${dateLabel(sel.date)}. Please choose another time.`])));
  on("#rResend", () => act(() => {}, "Deposit link re-sent", [`Reminder: authorize your deposit for ${sel.ref}`, `Please authorize your ${money(sel.deposit)} deposit to confirm your reservation.`]));
  on("#rComplete", () => act(r => { r.status = "completed"; }, "Marked completed"));
  on("#rRelease", () => act(r => { r.depositStatus = "released"; }, "Deposit released", [`Deposit released for ${sel.ref}`, `Your ${money(sel.deposit)} deposit hold has been released. Thank you!`]));
  on("#rCapture", () => askConfirm(`Capture $100.00 from the deposit for cleaning/damage? (Simulated)`, () => act(r => { r.depositStatus = "partially captured ($100.00)"; }, "Partial capture recorded", [`Deposit update for ${sel.ref}`, `$100.00 of your deposit was applied to post-event cleaning. The remainder has been released.`])));
  on("#rCancel", () => askConfirm(`Cancel ${sel.ref}?`, () => act(r => { r.status = "cancelled"; if (r.depositStatus === "held") r.depositStatus = "released"; }, "Reservation cancelled", [`Reservation ${sel.ref} cancelled`, `Your reservation was cancelled by Management. Any deposit hold has been released.`])));
  on("#rNoteSave", () => act(r => { r.mgmtNote = $("#rNote").value; }, "Note saved"));
}
function resDetail(r) {
  const a = AMENITIES.find(x => x.id === r.amenity);
  return `<div class="row between"><h3>${esc(r.ref)}</h3><span class="badge ${RES_CLS[r.status]}">${RES_LABEL[r.status]}</span></div><p class="muted small">${esc(a.name)} · requested ${esc(dt(r.created))}</p>
    <div class="facts"><div><span>Date</span>${esc(dateLabel(r.date))}</div><div><span>Time</span>${hourLabel(r.start)}–${hourLabel(r.start + r.hours)}</div><div><span>Resident</span>${esc(r.name)} · ${esc(r.unit)}</div><div><span>Guests</span>${r.guests} / ${a.cap}</div><div><span>Email</span>${esc(r.email)}</div><div><span>Phone</span>${esc(r.phone)}</div><div><span>Fee</span>${r.fee ? money(r.fee) : "None"}</div><div><span>Deposit</span>${r.deposit ? `${money(r.deposit)} · ${esc(r.depositStatus)}` : "None"}</div></div>
    ${r.notes ? `<div class="alert alert-info small">Resident note: ${esc(r.notes)}</div>` : ""}
    <div class="field" style="margin-top:12px"><label>Internal note</label><textarea id="rNote" style="min-height:70px">${esc(r.mgmtNote || "")}</textarea></div>
    <div class="row">${r.status === "pending" ? `<button class="btn btn-ok btn-sm" id="rApprove" type="button">Approve</button><button class="btn btn-danger btn-sm" id="rDecline" type="button">Decline</button>` : ""}
    ${r.status === "approved" ? `<button class="btn btn-ghost btn-sm" id="rResend" type="button">Resend deposit link</button>` : ""}
    ${r.status === "deposit_paid" ? `<button class="btn btn-ghost btn-sm" id="rComplete" type="button">Mark completed</button>` : ""}
    ${r.depositStatus === "held" && ["completed","deposit_paid"].includes(r.status) ? `<button class="btn btn-ok btn-sm" id="rRelease" type="button">Release deposit</button><button class="btn btn-danger btn-sm" id="rCapture" type="button">Capture $100</button>` : ""}
    ${["pending","approved","deposit_paid"].includes(r.status) ? `<button class="btn btn-danger btn-sm" id="rCancel" type="button">Cancel</button>` : ""}<button class="btn btn-dark btn-sm" id="rNoteSave" type="button">Save note</button></div>`;
}
function resCalendar() {
  const res = load("reservations", []).filter(r => !["declined","cancelled"].includes(r.status));
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const days = Array.from({length:14}, (_, i) => addDays(start, i));
  openModal(`<h3>Next 14 days</h3><div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Day</th>${AMENITIES.map(a => `<th>${esc(a.name)}</th>`).join("")}</tr></thead><tbody>
    ${days.map(d => `<tr><td class="small"><b>${esc(d.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"}))}</b></td>${AMENITIES.map(a => `<td class="small">${res.filter(r => r.amenity === a.id && r.date === ymd(d)).map(r => `<span class="badge ${RES_CLS[r.status]}" style="margin:1px 0">${hourLabel(r.start)} ${esc(r.unit)}</span>`).join("<br>") || '<span class="muted">—</span>'}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>`);
}

/* feedback */
function adminFeedback(m, v) {
  const all = load("feedback", []);
  const list = fbFilter === "All" ? all : all.filter(f => f.status === fbFilter);
  const sel = all.find(f => f.id === selFb);
  m.innerHTML = `<h2>Feedback inbox</h2><div class="tabs" style="margin-top:14px">${["All", ...FB_STATUSES].map(s => `<button type="button" class="tab ${fbFilter === s ? "on" : ""}" data-ff="${s}">${s} <span class="small">(${s === "All" ? all.length : all.filter(f => f.status === s).length})</span></button>`).join("")}</div>
    <div class="split"><div class="stack">${list.map(f => `<div class="card click" style="cursor:pointer;padding:16px;${f.id === selFb ? "border-color:var(--coral)" : ""}" data-f-id="${f.id}"><div class="row between"><b>${esc(f.name)} · Unit ${esc(f.unit)}</b><span class="badge ${f.status === "New" ? "b-coral" : f.status === "In Review" ? "b-warn" : "b-ok"}">${f.status}</span></div><p style="margin:6px 0" class="small">${esc(f.message.length > 140 ? f.message.slice(0, 140) + "…" : f.message)}</p><span class="small muted">${esc(f.category)} · ${esc(dt(f.date))}</span></div>`).join("") || `<div class="empty">No messages.</div>`}</div>
    <div class="detail">${sel ? `<div class="row between"><h3>${esc(sel.category)}</h3><span class="small muted">${esc(dt(sel.date))}</span></div>
      <div class="facts"><div><span>Resident</span>${esc(sel.name)}</div><div><span>Unit</span>${esc(sel.unit)}</div><div><span>Email</span>${esc(sel.email || "—")}</div><div><span>Phone</span>${esc(sel.phone || "—")}</div></div>
      <div class="card" style="background:var(--sand);border:0;white-space:pre-line">${esc(sel.message)}</div>
      <div class="field" style="margin-top:12px"><label>Status</label><select id="fStatus">${FB_STATUSES.map(s => `<option ${s === sel.status ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      <div class="field"><label>Response to resident (emailed)</label><textarea id="fResp" style="min-height:80px">${esc(sel.response)}</textarea></div>
      <div class="field"><label>Internal notes</label><textarea id="fInt" style="min-height:60px">${esc(sel.internal)}</textarea></div>
      <div class="row"><button class="btn btn-dark btn-sm" id="fSave" type="button">Save</button><button class="btn btn-danger btn-sm" id="fDel" type="button">Delete</button></div>`
      : `<div class="empty">Select a message to respond.</div>`}</div></div>`;
  $$("[data-ff]", m).forEach(b => b.onclick = () => { fbFilter = b.dataset.ff; adminFeedback(m, v); });
  $$("[data-f-id]", m).forEach(c => c.onclick = () => { selFb = c.dataset.fId; adminFeedback(m, v); });
  if (!sel) return;
  $("#fSave").onclick = () => { const list = load("feedback", []); const f = list.find(x => x.id === sel.id); const prevResp = f.response; f.status = $("#fStatus").value; f.response = $("#fResp").value.trim(); f.internal = $("#fInt").value; save("feedback", list);
    if (f.response && f.response !== prevResp && f.email) sendDemoEmail(f.email, "Response from Harbor Point Management", `Hi ${f.name},\n\nThank you for your message about "${f.category}".\n\n${f.response}\n\n— Harbor Point Management`);
    toast("Feedback saved"); pageManagement(v); };
  $("#fDel").onclick = () => askConfirm("Delete this message permanently?", () => { save("feedback", load("feedback", []).filter(x => x.id !== sel.id)); selFb = null; toast("Deleted"); pageManagement(v); });
}

/* reports */
function adminReports(m, v) {
  const orders = load("orders", []).filter(o => o.payment === "Paid");
  const years = [...new Set(orders.map(o => new Date(o.date).getFullYear()))].sort();
  if (!years.includes(reportYear)) reportYear = years[years.length - 1] || new Date().getFullYear();
  const yearOrders = orders.filter(o => new Date(o.date).getFullYear() === reportYear);
  const months = Array.from({length:12}, (_, i) => yearOrders.filter(o => new Date(o.date).getMonth() === i).reduce((a, o) => a + o.total, 0));
  const max = Math.max(...months, 1);
  const byCat = {}; yearOrders.forEach(o => o.items.forEach(i => { byCat[i.cat || "Other"] = (byCat[i.cat || "Other"] || 0) + i.price * i.qty; }));
  const fees = yearOrders.reduce((a, o) => a + o.fee, 0), gross = yearOrders.reduce((a, o) => a + o.total, 0);
  const W = 720, H = 260, bw = W / 12;
  const labels = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  m.innerHTML = `<div class="row between"><h2>Financial reports</h2><div class="row"><select id="ry" class="pill-btn">${years.map(y => `<option ${y === reportYear ? "selected" : ""}>${y}</option>`).join("")}</select><button class="btn btn-ghost btn-sm" id="rCsv" type="button">Copy CSV</button></div></div>
    <div class="grid g4" style="margin:16px 0">${kpi("Gross collected", money(gross), `${yearOrders.length} paid orders`)}${kpi("Service revenue", money(gross - fees), "Excluding processing fees")}${kpi("Processing fees", money(fees), "Passed through to card processor")}${kpi("Avg order", money(yearOrders.length ? Math.round(gross / yearOrders.length) : 0), "Per paid order")}</div>
    <div class="grid" style="grid-template-columns:2fr 1fr;gap:18px"><div class="chart"><h3 style="margin-bottom:10px">Monthly revenue · ${reportYear}</h3>
      <svg viewBox="0 0 ${W} ${H + 30}" role="img" aria-label="Monthly revenue bar chart">${[0, .25, .5, .75, 1].map(f => `<line x1="0" x2="${W}" y1="${H - f * (H - 20)}" y2="${H - f * (H - 20)}" stroke="#ece6da"/><text x="2" y="${H - f * (H - 20) - 4}" font-size="11" fill="#8a949a">${money(Math.round(max * f)).replace(".00", "")}</text>`).join("")}
      ${months.map((val, i) => { const h = val / max * (H - 20); return `<g><rect x="${i * bw + 12}" y="${H - h}" width="${bw - 24}" height="${Math.max(h, 1)}" rx="5" fill="${i === new Date().getMonth() && reportYear === new Date().getFullYear() ? "#e0704f" : "#2a7f86"}"><title>${labels[i]}: ${money(val)}</title></rect><text x="${i * bw + bw / 2}" y="${H + 20}" font-size="12" text-anchor="middle" fill="#5f6c73">${labels[i]}</text></g>`; }).join("")}</svg></div>
      <div class="chart"><h3 style="margin-bottom:10px">By category</h3>${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, val]) => `<div style="margin-bottom:12px"><div class="row between small"><b>${esc(c)}</b><span>${money(val)}</span></div><div style="height:8px;background:var(--sand);border-radius:9px;overflow:hidden"><div style="height:100%;width:${val / Math.max(...Object.values(byCat)) * 100}%;background:var(--sea)"></div></div></div>`).join("") || '<p class="muted">No revenue yet.</p>'}</div></div>`;
  $("#ry").onchange = e => { reportYear = +e.target.value; adminReports(m, v); };
  $("#rCsv").onclick = () => copyText(toCsv([["Month","Revenue"], ...months.map((val, i) => [`${labels[i]} ${reportYear}`, (val / 100).toFixed(2)]), [], ["Category","Revenue"], ...Object.entries(byCat).map(([c, val]) => [c, (val / 100).toFixed(2)])]));
}

/* aria review */
function adminAria(m, v) {
  const chats = load("chats", []);
  m.innerHTML = `<h2>Aria conversation review</h2><p class="muted">Review what residents ask the virtual concierge to spot gaps and improve answers.</p>
    <div class="grid g4" style="margin:16px 0">${kpi("Conversations", chats.length, "Last 30 days")}${kpi("Unreviewed", chats.filter(c => c.status === "Unreviewed").length, "Awaiting review")}${kpi("Follow-up", chats.filter(c => c.status === "Needs follow-up").length, "Flagged by Management")}${kpi("Spanish", chats.filter(c => c.lang === "es").length, "Conversations in Spanish")}</div>
    <div class="stack">${chats.map(c => `<div class="card"><div class="row between"><div><b>${esc(c.messages[0]?.text || "(empty)")}</b><div class="small muted">${esc(dt(c.date))} · ${c.messages.length} messages · ${c.lang === "es" ? "Spanish" : "English"}</div></div>
      <div class="row"><select data-cs="${c.id}" class="pill-btn">${["Unreviewed","Reviewed","Needs follow-up"].map(s => `<option ${s === c.status ? "selected" : ""}>${s}</option>`).join("")}</select><button class="btn btn-ghost btn-sm" data-cv="${c.id}" type="button">View</button></div></div></div>`).join("") || `<div class="empty">No conversations yet. Try the Aria chat bubble.</div>`}</div>`;
  $$("[data-cs]", m).forEach(s => s.onchange = () => { const list = load("chats", []); list.find(c => c.id === s.dataset.cs).status = s.value; save("chats", list); toast("Review status saved"); pageManagement(v); });
  $$("[data-cv]", m).forEach(b => b.onclick = () => { const c = load("chats", []).find(x => x.id === b.dataset.cv); openModal(`<h3>Conversation</h3><div class="chat-body" style="margin-top:12px;border-radius:12px;max-height:60vh">${c.messages.map(x => `<div class="msg ${x.who === "me" ? "me" : "bot"}">${esc(x.text)}</div>`).join("")}</div>`); });
}

/* outbox */
function adminOutbox(m, v) {
  const box = load("outbox", []);
  m.innerHTML = `<div class="row between"><div><h2>Demo outbox</h2><p class="muted">Every email the portal would send. In production these go out through an email service; in the demo nothing leaves your browser.</p></div>${box.length ? `<button class="btn btn-ghost btn-sm" id="obClear" type="button">Clear</button>` : ""}</div>
    ${box.map(e => `<div class="outbox-mail"><header><div><b>${esc(e.subject)}</b><div class="small muted">To: ${esc(e.to)}</div></div><div class="row"><span class="badge ${e.kind === "Management" ? "b-navy" : "b-sea"}">${esc(e.kind)}</span><span class="small muted">${esc(dt(e.date))}</span></div></header><div class="mbody">${esc(e.body)}</div></div>`).join("") || `<div class="empty">No emails yet. Place an order, submit feedback or request a reservation on the resident site, then come back here.</div>`}`;
  $$(".outbox-mail header", m).forEach(h => h.onclick = () => h.parentElement.classList.toggle("open"));
  const c = $("#obClear"); if (c) c.onclick = () => { save("outbox", []); pageManagement(v); };
}

/* helpers */
function toCsv(rows) { return rows.map(r => r.map(c => { const s = String(c ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\n"); }
async function copyText(text) { try { await navigator.clipboard.writeText(text); toast("Copied to clipboard. Paste into Excel or Sheets."); } catch (_) { openModal(`<h3>CSV export</h3><p class="small muted">Copy the text below and paste it into Excel or Google Sheets.</p><textarea style="width:100%;min-height:300px;font-family:monospace;font-size:12px" readonly>${esc(text)}</textarea>`); } }
function askConfirm(message, onYes) {
  openModal(`<h3>Please confirm</h3><p>${esc(message)}</p><div class="row"><button class="btn btn-dark" id="cfYes" type="button">Confirm</button><button class="btn btn-ghost" id="cfNo" type="button">Cancel</button></div>`);
  $("#cfYes").onclick = () => { closeModal(); onYes(); }; $("#cfNo").onclick = closeModal;
}
function confirmReset() { askConfirm("Reset all demo data to the original sample? Orders, reservations and messages you created will be cleared.", () => { const sess = load("mgmtSession", false); wipe(); seedAll(); save("mgmtSession", sess); cart = []; renderCartBadge(); chatSession = null; $("#chatBody").innerHTML = ""; toast("Demo data reset"); route(); }); }

/* ---------- boot ---------- */
function boot() {
  ensureSeed();
  LANG = load("lang", "en") === "es" ? "es" : "en";
  $("#brandLogo").innerHTML = LOGO;
  renderShell();
  $("#langBtn").onclick = () => { LANG = LANG === "en" ? "es" : "en"; save("lang", LANG); renderShell(); $("#chatBody").innerHTML = ""; if ($("#chat").classList.contains("open")) renderChatChrome(); route(); renderDrawer(); };
  $("#cartBtn").onclick = () => { renderDrawer(); openDrawer(); };
  $("#drawerClose").onclick = closeDrawer; $("#scrim").onclick = closeDrawer;
  $("#menuBtn").onclick = () => $("#navLinks").classList.toggle("open");
  $("#resetBtn").onclick = () => confirmReset();
  $("#chatFab").onclick = () => $("#chat").classList.contains("open") ? $("#chat").classList.remove("open") : openChat();
  $("#chatClose").onclick = () => $("#chat").classList.remove("open");
  $("#chatForm").onsubmit = e => { e.preventDefault(); chatSend($("#chatInput").value); };
  $("#modal .x").onclick = closeModal;
  $("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
  $("#lbClose").onclick = () => $("#lightbox").classList.remove("open");
  $("#lbPrev").onclick = () => openLightbox(lbIdx - 1); $("#lbNext").onclick = () => openLightbox(lbIdx + 1);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeModal(); closeDrawer(); $("#lightbox").classList.remove("open"); $("#chat").classList.remove("open"); }
    if ($("#lightbox").classList.contains("open")) { if (e.key === "ArrowLeft") openLightbox(lbIdx - 1); if (e.key === "ArrowRight") openLightbox(lbIdx + 1); }
  });
  const clearErr = e => { const f = e.target.closest && e.target.closest(".field"); if (f) f.classList.remove("invalid"); const map = {terms:"terms", autoAuth:"autoAuth", rulesOk:"rules"}; if (map[e.target.id]) setErr(map[e.target.id], false); };
  document.addEventListener("input", clearErr); document.addEventListener("change", clearErr);
  window.addEventListener("hashchange", route);
  route();
}
document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
