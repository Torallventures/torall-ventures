<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Point Residences — Resident Portal Demo</title>
<meta name="description" content="Demo resident services portal for a fictional condominium: store, reservations, feedback, AI concierge and management dashboard.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* Harbor Point — bayfront palette: marine depth, sea-glass aqua, brass hardware */
:root{
  --abyss:#06202b;--harbor:#0d3a4a;--tide:#1e8f87;--tide-l:#2bb3a8;--tide-soft:#dff1ee;--foam:#f3f7f6;--mist:#e7eff0;
  --brass:#c8a15a;--brass-d:#a6823c;--ink:#10222b;--muted:#5b6e76;--line:#dbe6e7;--white:#fff;
  --ok:#24805a;--warn:#b07a12;--bad:#bf3f37;
  --navy:var(--abyss);--navy-2:var(--harbor);--sea:var(--tide);--sea-soft:var(--tide-soft);--sand:var(--mist);--sand-2:#d6e3e4;--coral:var(--brass);--coral-d:var(--brass-d);
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Figtree",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --r-lg:26px;--r:16px;--r-sm:10px;--ease:cubic-bezier(.22,1,.36,1);--shadow:0 24px 60px -24px rgba(6,32,43,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--foam);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img,svg,video{display:block;max-width:100%}
:focus-visible{outline:2.5px solid var(--brass);outline-offset:3px;border-radius:6px}
::selection{background:var(--brass);color:#fff}
#progress{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--tide-l),var(--brass));transform-origin:0 50%;transform:scaleX(0);z-index:100}

.demo-banner{background:var(--abyss);color:#cfe3e4;text-align:center;font-size:12.5px;font-weight:600;padding:7px 12px;position:relative;z-index:45}
.demo-banner button{background:rgba(200,161,90,.18);border:1px solid rgba(200,161,90,.5);color:#f1dcae;border-radius:99px;padding:2px 11px;margin-left:10px;cursor:pointer;font-weight:700;font-size:12px}
.nav{position:sticky;top:0;z-index:40;transition:background .4s var(--ease),box-shadow .4s,border-color .4s;background:rgba(243,247,246,.82);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid transparent}
body.over-hero:not(.scrolled) .nav{background:transparent;backdrop-filter:none}
body.over-hero .nav{position:fixed;left:0;right:0;top:var(--navtop,33px)}
body.over-hero:not(.scrolled) .nav .links a,body.over-hero:not(.scrolled) .brand{color:#fff}
body.over-hero:not(.scrolled) .brand small{color:rgba(255,255,255,.7)}
body.over-hero:not(.scrolled) .pill-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
body.over-hero:not(.scrolled) .links a.active{color:#f1dcae}
body.scrolled .nav{background:rgba(243,247,246,.9);border-bottom-color:var(--line);box-shadow:0 10px 30px -20px rgba(6,32,43,.3)}
.nav-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:14px 24px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;white-space:nowrap;color:var(--abyss)}
.brand-mark{width:40px;height:40px;transition:transform .6s var(--ease)}
.brand:hover .brand-mark{transform:rotate(-8deg) scale(1.06)}
.brand b{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1;letter-spacing:.01em}
.brand small{display:block;font-size:11px;letter-spacing:.18em;color:var(--muted);margin-top:2px}
.links{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.links a{position:relative;text-decoration:none;padding:8px 12px;font-weight:600;font-size:14px;color:var(--abyss);transition:color .3s}
.links a::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:1.5px;background:var(--brass);transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.links a:hover::after,.links a.active::after{transform:scaleX(1);transform-origin:left}
.links a.active{color:var(--brass-d)}
.nav-tools{display:flex;gap:8px;align-items:center}
.pill-btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:transform .3s var(--ease),border-color .3s,background .3s}
.pill-btn:hover{border-color:var(--brass);transform:translateY(-1px)}
.cart-count{background:var(--brass);color:#fff;border-radius:99px;font-size:11px;min-width:19px;height:19px;display:inline-grid;place-items:center;padding:0 5px}
.cart-count.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.45)}}
.menu-btn{display:none}
@media (max-width:980px){
  .links{display:none;position:absolute;top:100%;left:0;right:0;background:var(--foam);flex-direction:column;padding:12px 18px 18px;border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .links.open{display:flex;animation:drop .4s var(--ease)}
  body .nav .links a{color:var(--abyss)!important}
  .menu-btn{display:inline-flex}.nav-in{position:relative}.nav-tools{margin-left:auto}
}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
@media (max-width:560px){#cartBtnLabel,.lang-label{display:none}.brand small{display:none}.brand b{font-size:20px}.nav-in{gap:10px;padding:10px 14px}.pill-btn{flex-shrink:0;padding:8px 10px}}

main{min-height:70vh}
main.enter{animation:pageIn .7s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}}

.wrap{max-width:1240px;margin:0 auto;padding-left:24px;padding-right:24px}
.section{padding:110px 0}
.eyebrow{font-size:13px;color:var(--tide);font-weight:700}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--abyss);margin:0;letter-spacing:-.005em}
h1{font-size:clamp(46px,7.4vw,104px);line-height:.95}
h2{font-size:clamp(34px,4.4vw,58px);line-height:1.02}
h3{font-size:24px;line-height:1.15}
.lead{font-size:18px;color:var(--muted);max-width:58ch}
.center-h{text-align:center;max-width:16ch;margin:0 auto 54px}
.page-head{padding-top:60px;padding-bottom:30px}
.page-head h1{font-size:clamp(44px,6vw,80px)}
.page-head p{color:var(--muted);max-width:60ch;margin:12px 0 0;font-size:17px}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:960px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}.section{padding:72px 0}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px}
.muted{color:var(--muted)}.small{font-size:13.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.hr{height:1px;background:var(--line);margin:16px 0}

.btn{position:relative;overflow:hidden;border:0;border-radius:99px;padding:14px 26px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-size:14.5px;transition:transform .4s var(--ease),box-shadow .4s var(--ease),background .3s,color .3s;isolation:isolate}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(255,255,255,.18);transform:translateX(-101%);transition:transform .6s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn:hover::before{transform:translateX(0)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--brass);color:#1b1306;box-shadow:0 12px 30px -12px rgba(200,161,90,.8)}
.btn-primary:hover{box-shadow:0 18px 40px -14px rgba(200,161,90,.9)}
.btn-dark{background:var(--abyss);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid currentColor;color:var(--abyss)}
.btn-ghost::before{background:rgba(6,32,43,.06)}
.btn-glass{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px)}
.btn-light{background:#fff;color:var(--abyss)}
.btn-sm{padding:8px 15px;font-size:13px}
.btn-danger{background:#fbe9e7;color:var(--bad)}.btn-ok{background:#e1f2ea;color:var(--ok)}

.media{position:relative;overflow:hidden;width:100%;height:100%;background:var(--harbor)}
.media>svg{position:absolute;inset:0;width:100%;height:100%}
.media>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity 1s var(--ease),transform 1.6s var(--ease)}
.media>img.loaded{opacity:1;transform:scale(1)}

.rv-up,.rv-left,.rv-right,.rv-zoom,.rv{transition:opacity 1s var(--ease),transform 1.1s var(--ease),clip-path 1.2s var(--ease);transition-delay:var(--d,0s)}
.rv,.rv-up{opacity:0;transform:translateY(38px)}
.rv-left{opacity:0;transform:translateX(-50px)}
.rv-right{opacity:0;transform:translateX(50px)}
.rv-zoom{opacity:0;clip-path:inset(12% 12% 12% 12% round 26px);transform:scale(1.04)}
.in.rv,.in.rv-up,.in.rv-left,.in.rv-right{opacity:1;transform:none}
.in.rv-zoom{opacity:1;clip-path:inset(0 0 0 0 round 26px);transform:none}
.stagger>*{opacity:0;transform:translateY(30px);transition:opacity .9s var(--ease),transform 1s var(--ease),box-shadow .5s var(--ease);transition-delay:calc(var(--i,0) * 90ms)}
.stagger.in>*{opacity:1;transform:none}
.stagger.in>*:hover{transition-delay:0s}
.load-in{opacity:0;transform:translateY(22px);animation:loadIn 1.1s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes loadIn{to{opacity:1;transform:none}}
.hl .ln{display:block;overflow:hidden;padding-bottom:.08em}
.hl .ln>span{display:inline-block;transform:translateY(105%);animation:lineUp 1.2s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes lineUp{to{transform:none}}

.hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;color:#fff;display:flex;align-items:flex-end}
.hero-art{position:absolute;inset:0;background:var(--abyss)}
.hero-art>svg{position:absolute;inset:0;width:100%;height:100%}
.hero-art video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity 1.6s ease,transform 8s var(--ease)}
.hero-art video.loaded{opacity:1;transform:scale(1)}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,32,43,.55) 0%,rgba(6,32,43,.05) 35%,rgba(6,32,43,.35) 62%,rgba(6,32,43,.92) 100%),linear-gradient(90deg,rgba(6,32,43,.55),transparent 65%)}
.hero-grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1px);background-size:3px 3px;pointer-events:none}
.hero-in{position:relative;max-width:1240px;margin:0 auto;padding:140px 24px 92px;width:100%;will-change:transform,opacity}
.hero-kicker{font-weight:600;color:#f1dcae;letter-spacing:.04em;margin:0 0 14px}
.hero h1,.life-hero h1{color:#fff;max-width:13ch}
.waterline{height:2px;width:min(340px,60%);background:linear-gradient(90deg,var(--brass),rgba(200,161,90,0));margin:30px 0 26px;transform-origin:left;transform:scaleX(0)}
.load-line{animation:lineDraw 1.4s var(--ease) .65s forwards}
@keyframes lineDraw{to{transform:scaleX(1)}}
.hero-sub{font-size:19px;max-width:46ch;color:rgba(255,255,255,.88);margin:0 0 34px}
.hero-stats{display:flex;gap:46px;margin-top:56px;flex-wrap:wrap}
.hero-stats b{display:block;font-family:var(--serif);font-size:44px;font-weight:600;line-height:1}
.hero-stats span{font-size:13px;opacity:.75}
.scroll-cue{position:absolute;left:50%;margin-left:-13px;bottom:34px;width:26px;height:44px;border:1.5px solid rgba(255,255,255,.6);border-radius:20px;display:flex;justify-content:center;padding-top:8px}
.scroll-cue span{width:3px;height:9px;border-radius:3px;background:#fff;animation:cue 1.8s var(--ease) infinite}
@keyframes cue{0%{transform:translateY(0);opacity:1}70%{transform:translateY(14px);opacity:0}100%{opacity:0}}
@media (max-width:600px){.hero-stats{gap:28px}.hero-stats b{font-size:34px}.scroll-cue{display:none}.hero-in{padding-bottom:64px}}

.marquee{background:var(--abyss);color:#e9f3f2;overflow:hidden;padding:20px 0;border-top:1px solid rgba(255,255,255,.08)}
.marquee-track{display:flex;gap:34px;width:max-content;animation:marq 38s linear infinite;align-items:center}
.marquee span{font-family:var(--serif);font-size:30px;font-weight:500;white-space:nowrap}
.marquee i{color:var(--brass);font-style:normal;font-size:14px}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}

.intro-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:80px;align-items:center}
.intro-media{position:relative}
.frame{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:4/5;box-shadow:var(--shadow)}
.frame .media{height:100%}
.intro-badge{position:absolute;right:-28px;bottom:40px;background:#fff;border-radius:20px;padding:20px 24px;box-shadow:var(--shadow);max-width:220px}
.intro-badge b{font-family:var(--serif);font-size:46px;font-weight:600;color:var(--abyss);display:block;line-height:1}
.intro-badge span{font-size:13.5px;color:var(--muted)}
.intro-copy h2{margin-bottom:20px}
.ticks{list-style:none;padding:0;margin:28px 0 34px}
.ticks li{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600}
.ticks li svg{color:var(--tide);flex:0 0 auto;background:var(--tide-soft);border-radius:50%;padding:5px;width:30px;height:30px}
@media (max-width:900px){.intro-grid{grid-template-columns:1fr;gap:50px}.intro-badge{right:12px}}

.services{background:#fff}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media (max-width:900px){.svc-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.svc-grid{grid-template-columns:1fr}}
.svc{position:relative;display:flex;flex-direction:column;text-decoration:none;border-radius:var(--r-lg);overflow:hidden;background:var(--foam);border:1px solid var(--line)}
.svc::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,-200px) var(--my,-200px),rgba(200,161,90,.16),transparent 45%);opacity:0;transition:opacity .4s}
.stagger.in>.svc:hover{transform:translateY(-8px);box-shadow:var(--shadow)}
.svc:hover::after{opacity:1}
.svc-img{height:210px}
.svc-img img,.svc-img svg{transition:transform 1.4s var(--ease),opacity 1s!important}
.svc:hover .svc-img img.loaded,.svc:hover .svc-img svg{transform:scale(1.08)}
.svc-body{padding:24px 26px 28px;position:relative}
.svc .ico{position:absolute;top:-26px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--brass);color:#1b1306;display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(200,161,90,.9);transition:transform .6s var(--ease)}
.svc:hover .ico{transform:rotate(-12deg) scale(1.08)}
.svc h3{margin-bottom:8px}
.svc p{margin:0;color:var(--muted);font-size:15px}

.amen-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;height:520px}
.amen-tile{position:relative;border-radius:var(--r-lg);overflow:hidden;text-decoration:none;color:#fff}
.amen-tile .media{position:absolute;inset:0}
.amen-tile .media img,.amen-tile .media svg{transition:transform 1.6s var(--ease),opacity 1s}
.amen-tile:hover .media img.loaded,.amen-tile:hover .media svg{transform:scale(1.1)}
.amen-tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(6,32,43,.9))}
.amen-cap{position:absolute;left:22px;right:22px;bottom:22px;z-index:2}
.amen-cap h3{color:#fff;font-size:28px}
.amen-cap span{font-size:13px;color:#f1dcae;font-weight:600}
.amen-cap p{margin:8px 0 0;font-size:14px;opacity:0;max-height:0;overflow:hidden;transition:opacity .6s var(--ease),max-height .6s var(--ease)}
.amen-tile:hover .amen-cap p{opacity:.9;max-height:80px}
@media (min-width:901px){.amen-row{display:flex}.amen-tile{flex:1;transition:flex .8s var(--ease),opacity .9s var(--ease),transform 1s var(--ease)!important}.amen-tile:hover{flex:1.8}}
@media (max-width:900px){.amen-row{grid-template-columns:repeat(2,1fr);height:auto}.amen-tile{height:300px}.amen-cap p{opacity:.9;max-height:80px}}

.band-photo{position:relative;overflow:hidden;color:#fff;padding:130px 0}
.band-bg{position:absolute;inset:-12% 0;will-change:transform}
.band-bg .media{height:100%}
.band-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,32,43,.92),rgba(6,32,43,.55))}
.band-grid{position:relative;display:grid;grid-template-columns:1fr 1.1fr;gap:60px;align-items:center}
.band-photo h2{color:#fff}
.band-contact{color:#c9dadd;font-size:17px;margin-top:18px}
.notice-card{background:rgba(255,255,255,.96);color:var(--ink);border-radius:var(--r-lg);padding:10px 28px;box-shadow:var(--shadow)}
.notice{display:flex;gap:18px;align-items:flex-start;padding:20px 0;border-bottom:1px solid var(--line)}
.notice:last-child{border-bottom:0}
.notice time{flex:0 0 62px;text-align:center;background:var(--abyss);color:#fff;border-radius:14px;padding:9px 0;font-weight:700;line-height:1.1;font-size:20px}
.notice time small{display:block;font-size:11px;color:#f1dcae;font-weight:600}
@media (max-width:900px){.band-grid{grid-template-columns:1fr}}

.cta-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.cta-media .frame{aspect-ratio:5/4}
.cta-grid h2{margin-bottom:16px}.cta-grid .lead{margin-bottom:30px}
@media (max-width:900px){.cta-grid{grid-template-columns:1fr;gap:40px}}

.life-hero{position:relative;height:88vh;min-height:560px;overflow:hidden;display:flex;align-items:flex-end;color:#fff}
.life-hero-in{position:relative;padding-bottom:80px;width:100%}
.life-hero h1{max-width:12ch}
.day-line{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.day-line li{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#fff;border:1px solid var(--line)}
.stagger.in>li:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.day-img{height:220px}
.day-line li>div:last-child{padding:20px 22px 24px}
.day-line b{font-family:var(--serif);font-size:30px;color:var(--abyss);font-weight:600}
.day-line p{margin:6px 0 0;color:var(--muted);font-size:15px}
.day-line li::before{content:"";position:absolute;top:18px;left:18px;width:10px;height:10px;border-radius:50%;background:var(--brass);z-index:2;box-shadow:0 0 0 6px rgba(200,161,90,.3);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(200,161,90,0)}}
@media (max-width:900px){.day-line{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.day-line{grid-template-columns:1fr}}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:230px;gap:14px}
.gallery button{border:0;padding:0;border-radius:var(--r);overflow:hidden;cursor:zoom-in;position:relative;background:var(--harbor)}
.gallery button .media img,.gallery button .media svg{transition:transform 6s ease-out,opacity 1s}
.gallery button:hover .media img.loaded,.gallery button:hover .media svg{transform:scale(1.14) translate(-2%,-2%)}
.gallery button::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(6,32,43,.75));opacity:.8}
.gallery button span{position:absolute;left:16px;bottom:14px;color:#fff;font-weight:700;font-size:14px;z-index:2;transform:translateY(6px);transition:transform .5s var(--ease)}
.gallery button:hover span{transform:none}
.gallery .wide{grid-column:span 2}.gallery .tall{grid-row:span 2}
@media (max-width:800px){.gallery{grid-template-columns:repeat(2,1fr);grid-auto-rows:170px}}
.lightbox{position:fixed;inset:0;background:rgba(3,16,22,.94);z-index:90;display:none;align-items:center;justify-content:center;padding:30px}
.lightbox.open{display:flex;animation:fade .4s ease}
@keyframes fade{from{opacity:0}}
.lightbox .lb-img{width:min(1100px,92vw);aspect-ratio:3/2;border-radius:18px;overflow:hidden;animation:zoomIn .6s var(--ease)}
@keyframes zoomIn{from{transform:scale(.94);opacity:0}}
.lightbox .lb-cap{color:#fff;text-align:center;margin-top:16px;font-family:var(--serif);font-size:24px}

.col-h i{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;background:#fff;border-radius:99px;padding:1px 8px;color:var(--mu)}
.dotc{width:9px;height:9px;border-radius:50%}
.dotc.pending{background:#c8a15a}.dotc.approved{background:#f07f3c}.dotc.deposit_paid{background:#1e8f87}.dotc.completed{background:#94a3ab}.dotc.closed{background:#d6455a}
.col-b{display:flex;flex-direction:column;gap:9px;min-height:60px}
.col-empty{border:1.5px dashed #c9d4d8;border-radius:12px;padding:18px;text-align:center;color:#8a9aa3;font-size:13px}
.rcard{position:relative;background:#fff;border-radius:14px;padding:12px 12px 10px 15px;cursor:grab;box-shadow:0 1px 2px rgba(6,32,43,.06);transition:transform .3s var(--ease),box-shadow .3s var(--ease),opacity .2s;animation:slideUp .45s var(--ease) both}
.rcard::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3.5px;border-radius:0 3px 3px 0;background:var(--c)}
.rcard:hover{transform:translateY(-2px);box-shadow:0 14px 30px -16px rgba(6,32,43,.45)}
.rcard.dragging{opacity:.4;transform:rotate(2deg) scale(.98)}
body.is-dragging .rcard:not(.dragging){transition:transform .3s}
.rc-top{display:flex;justify-content:space-between;gap:8px}.rc-top b{font-size:13.5px}.rc-top span{white-space:nowrap}
.rc-when{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mu);margin:5px 0 9px}
.rc-foot{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#3b4d56}
.rc-foot span:nth-child(2){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-dep{font-size:11.5px;font-weight:800;background:#f6ecd8;color:#86621f;border-radius:99px;padding:1px 7px}.rc-dep.ok{background:#e2f4ec;color:#1d7a50}
.hint{display:flex;align-items:center;gap:7px;color:var(--mu);font-size:13px;margin-top:8px}
.mcal{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px}
.mcal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mcal-h h3{font-family:var(--sans);font-size:18px;font-weight:750;min-width:180px;text-align:center}
.mcal-h .icon-btn:first-child svg{transform:rotate(180deg)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #eef2f4;border-left:1px solid #eef2f4}
.mdow{font-size:12px;font-weight:700;color:var(--mu);padding:8px;border-right:1px solid #eef2f4;border-bottom:1px solid #eef2f4;background:#fafcfc}
.mc{min-height:108px;padding:6px;border-right:1px solid #eef2f4;border-bottom:1px solid #eef2f4;display:flex;flex-direction:column;gap:3px}
.mc.off{background:#fafcfc}
.mc-d{font-size:12.5px;font-weight:700;color:var(--mu);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.mc.today .mc-d{background:var(--abyss);color:#fff}
.ev{border:0;text-align:left;font-size:11.5px;font-weight:700;border-radius:7px;padding:3px 6px;background:color-mix(in srgb,var(--c) 15%,#fff);color:color-mix(in srgb,var(--c) 75%,#000);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);transition:transform .2s}
.ev:hover{transform:translateX(2px)}
.ev.pending{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c) 12%,#fff) 0 6px,#fff 6px 10px)}
.mc .more{font-size:11px;color:var(--mu);padding-left:4px}
/* mail-style split */
.mail{display:grid;grid-template-columns:360px 1fr;background:#fff;border:1px solid var(--bd);border-radius:18px;overflow:hidden;min-height:560px}
@media (max-width:1000px){.mail{grid-template-columns:1fr}}
.mail-list{border-right:1px solid #eef2f4;display:flex;flex-direction:column;min-width:0}
.mail-tools{padding:12px;border-bottom:1px solid #eef2f4}
.mail-items{overflow:auto;max-height:640px}
.mi{display:flex;gap:11px;width:100%;border:0;background:none;text-align:left;padding:13px 14px;border-bottom:1px solid #f2f5f6;cursor:pointer;position:relative;transition:background .2s}
.mi:hover{background:#f8fbfb}
.mi.on{background:#f1f7f6}
.mi.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tide)}
.mi.unread b{color:#0f1e26}.mi.unread::after{content:"";position:absolute;right:14px;bottom:16px;width:8px;height:8px;border-radius:50%;background:#2f6fed}
.mi-t{flex:1;min-width:0}.mi-t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-t small{color:var(--mu);font-size:12px;white-space:nowrap}
.mi-c{display:block;font-size:12.5px;color:var(--mu);margin:1px 0}
.mi-p{display:block;font-size:13px;color:#4b5d66;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 9px}.sdot.ok{background:#1e8f87}.sdot.bad{background:#d6455a}.sdot.warn{background:#c8a15a}
.mail-read{padding:22px 26px;min-width:0;display:flex;flex-direction:column;animation:fade .35s}
.mr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.mr-h h2{font-family:var(--sans);font-size:20px;font-weight:750;margin-top:8px;color:#0f1e26}
.bubbles{display:flex;flex-direction:column;gap:10px;padding:16px 0;flex:1}
.bub{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;white-space:pre-line;animation:msgIn .4s var(--ease) both}
.bub.in{background:#f2f6f7;border-bottom-left-radius:5px}
.bub.out{background:#06202b;color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.bub.out small{display:block;color:#8fa9b1;font-size:11.5px;margin-top:4px}
.bub.out.aria{background:#e9f5f4;color:#0f1e26;margin-left:0;margin-right:auto;border-bottom-left-radius:5px;border-bottom-right-radius:16px;display:flex;gap:9px}
.chatlike .bub.in{margin-left:auto;background:#06202b;color:#fff;border-bottom-left-radius:16px;border-bottom-right-radius:5px}
.aria-av{width:24px;height:24px;flex:0 0 24px;border-radius:50%;background:linear-gradient(135deg,#2bb3a8,#c8a15a);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:13px}
.compose{border:1px solid #e6ebee;border-radius:16px;padding:10px;transition:box-shadow .3s,border-color .3s}
.compose:focus-within{border-color:var(--tide);box-shadow:0 0 0 4px rgba(30,143,135,.1)}
.compose textarea{width:100%;border:0;outline:0;resize:vertical;min-height:90px;padding:6px;font-size:14.5px}
.tpl{display:flex;gap:6px;flex-wrap:wrap;padding:2px 2px 6px}
.tpl button{border:1px solid #e6ebee;background:#fafcfc;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:650;cursor:pointer;transition:all .2s}
.tpl button:hover{border-color:var(--brass);background:#fdf8ee}
.int-in{flex:1;min-width:160px;border:0;border-top:1px dashed #e6ebee;padding:8px 6px;font-size:13px;outline:0;color:#6b7c86}
.bars{display:flex;flex-direction:column;gap:13px}
.bars.mini{gap:7px;margin-top:8px;font-size:12.5px}
.bar-r b{font-size:13.5px}.bar-r small{color:var(--mu)}
.meter{height:7px;background:#eef2f4;border-radius:9px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#1e8f87,#2bb3a8);border-radius:9px;transform-origin:left;animation:growX 1.1s var(--ease) both}
.meter i.warn{background:#c8a15a}.meter i.bad{background:#d6455a}
.email{max-width:680px;border:1px solid #e6ebee;border-radius:16px;overflow:hidden}
.email-h{display:flex;align-items:center;gap:12px;padding:16px 20px;background:#f8fafb;border-bottom:1px solid #eef2f4}
.email-h div{flex:1}.email-h b{display:block}.email-h small{color:var(--mu)}
.email h2{font-family:var(--sans);font-size:20px;font-weight:750;padding:20px 20px 0;color:#0f1e26}
.email-b{padding:14px 20px 22px;white-space:pre-line;font-size:14.5px;line-height:1.65}
.email-f{padding:12px 20px;background:#06202b;color:#9fb6bd;font-size:12px}
/* products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pcard{background:#fff;border:1px solid var(--bd);border-radius:18px;overflow:hidden;cursor:pointer}
.stagger.in>.pcard{transition:transform .4s var(--ease),box-shadow .4s var(--ease),opacity .5s}
.stagger.in>.pcard:hover{transform:translateY(-4px);box-shadow:0 22px 44px -26px rgba(6,32,43,.5)}
.pcard.off .pc-img{filter:grayscale(.85) opacity(.6)}
.pc-img{position:relative;height:150px;transition:filter .4s}
.pc-img .switch{position:absolute;top:10px;right:10px}
.pc-b{padding:14px 16px 16px}.pc-b small{color:var(--mu);font-size:12px;font-weight:600}.pc-b b{display:block;font-size:15px;margin:2px 0 8px}
.pc-price{font-weight:800}
.switch{position:relative;display:inline-block;width:40px;height:23px;flex:0 0 40px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#c9d4d8;border-radius:99px;cursor:pointer;transition:background .3s;box-shadow:inset 0 1px 2px rgba(0,0,0,.1)}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .35s var(--ease)}
.switch input:checked+span{background:var(--tide)}
.switch input:checked+span::after{transform:translateX(17px)}
.switch input:focus-visible+span{outline:2.5px solid var(--brass);outline-offset:2px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:650;font-size:14px}
.pe-prev{display:flex;gap:14px;align-items:center;background:#f4f7f8;border-radius:16px;padding:12px;margin-bottom:16px}
.pe-img{width:110px;height:80px;border-radius:12px;overflow:hidden;flex:0 0 110px}
.pe-prev small{display:block;color:var(--mu);font-size:12px}.pe-prev b{display:block;font-size:16px}.pe-prev span{font-weight:800}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed #c3ced3;border-radius:12px;padding:11px;cursor:pointer;font-weight:650;color:var(--mu);transition:all .2s}
.drop:hover{border-color:var(--tide);color:var(--tide);background:#f3faf9}
.confirm{text-align:center;padding:6px}
.confirm h3{font-family:var(--sans);font-size:18px;font-weight:700;max-width:30ch;margin:0 auto}
.confirm-ico{width:52px;height:52px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:#e2f4ec;color:#1d7a50;animation:pop .5s var(--ease)}
.confirm-ico.bad{background:#fbe9e7;color:#b8392f}
.confirm .row{justify-content:center!important}
body.mgmt .modal-card{max-width:520px}
body.mgmt .modal-card:has(.prev-host){max-width:760px}
/* command palette */
.cmdk{position:fixed;inset:0;z-index:96;background:rgba(6,20,28,.4);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.cmdk.open{opacity:1;visibility:visible}
.cmdk-box{width:min(620px,92vw);background:#fff;border-radius:18px;box-shadow:0 40px 100px -20px rgba(0,0,0,.5);overflow:hidden;transform:scale(.96) translateY(-8px);transition:transform .35s var(--ease)}
.cmdk.open .cmdk-box{transform:none}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #eef2f4;color:var(--mu)}
.cmdk-in input{flex:1;border:0;outline:0;font-size:16px;color:#0f1e26}
.cmdk-list{max-height:420px;overflow:auto;padding:8px}
.cmdk-g{font-size:11.5px;font-weight:750;color:var(--mu);padding:10px 10px 4px}
.cmdk-it{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 10px;border-radius:11px;cursor:pointer;text-align:left;color:#0f1e26}
.cmdk-it span{flex:1;min-width:0}.cmdk-it b{display:block;font-size:14px;font-weight:650}.cmdk-it small{color:var(--mu);font-size:12.5px}
.cmdk-it>svg{opacity:0;transition:opacity .2s,transform .2s}
.cmdk-it.on{background:#f1f7f6}.cmdk-it.on>svg{opacity:.6;transform:translateX(2px)}
.cmdk-it .sec-ico{width:28px;height:28px;flex-basis:28px}
.cmdk-empty{padding:30px;text-align:center;color:var(--mu)}
/* auth */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh;background:#fff}
.auth-art{position:relative;overflow:hidden;color:#fff}
.auth-art>.media{position:absolute;inset:0;animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.08)}}
.auth-shade{position:absolute;inset:0;background:linear-gradient(160deg,rgba(6,32,43,.55),rgba(6,32,43,.92))}
.auth-copy{position:absolute;left:56px;right:56px;bottom:56px;animation:slideUp .9s var(--ease) both}
.auth-copy h2{color:#fff;font-size:clamp(34px,3.6vw,52px);margin:22px 0 12px;max-width:14ch}
.auth-copy p{color:#c3d3d8;font-size:17px;max-width:44ch}
.auth-stats{display:flex;gap:40px;margin-top:30px}
.auth-stats b{display:block;font-family:var(--serif);font-size:34px;font-weight:600}.auth-stats span{font-size:13px;color:#9fb6bd}
.auth-form{display:grid;place-items:center;padding:40px 24px}
.auth-card{width:min(420px,100%);animation:slideUp .7s var(--ease) .1s both}
.auth-card.shake{animation:shake .4s}
.auth-card h1{font-family:var(--sans);font-size:32px;font-weight:780;letter-spacing:-.02em;margin:18px 0 6px}
.steps-dots{display:flex;gap:6px}
.steps-dots i{width:26px;height:5px;border-radius:9px;background:#e6ebee;transition:background .4s,width .4s var(--ease)}
.steps-dots i.on{background:var(--abyss);width:40px}
.field.fl{position:relative}
.field.fl input{padding:20px 14px 8px}
.field.fl label{position:absolute;left:15px;top:15px;font-weight:600;color:var(--mu);pointer-events:none;transition:all .25s var(--ease)}
.field.fl input:focus+label,.field.fl input:not(:placeholder-shown)+label{top:6px;font-size:11.5px;color:var(--tide)}
.otp{display:flex;gap:10px}
.otp input{width:100%;aspect-ratio:1/1.15;max-width:56px;text-align:center;font-size:24px;font-weight:700;border:1.5px solid #dbe6e7;border-radius:12px;transition:border-color .2s,box-shadow .2s,transform .2s}
.otp input:focus{outline:0;border-color:var(--tide);box-shadow:0 0 0 4px rgba(30,143,135,.12);transform:translateY(-2px)}
.auth-btn{width:100%;justify-content:center;padding:15px}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-art{min-height:300px}.auth-copy{left:24px;right:24px;bottom:24px}.auth-stats{display:none}}
/* mobile workspace */
@media (max-width:900px){
  .ws{grid-template-columns:1fr}
  .ws-rail{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-102%);transition:transform .45s var(--ease)}
  .ws.rail-open .ws-rail{transform:none}
  .ws.rail-open .ws-scrim{opacity:1;visibility:visible}
  .ws.collapsed .ws-lt{opacity:1;transform:none;width:auto;pointer-events:auto}
  .ws-search span,.ws-search kbd,.ws-demo,.ws-crumb span,.ws-crumb svg{display:none}
  .ws-search{max-width:44px;flex:0 0 44px;justify-content:center;padding:9px}
  .ws-top{padding:10px 14px}.ws-body{padding:20px 14px 110px}
  .kpi-grid{grid-template-columns:1fr 1fr}
}

/* =================== Applications (resident forms) =================== */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.form-card{position:relative;text-align:left;border:1px solid var(--line);background:#fff;border-radius:22px;padding:24px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.form-card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--fc);transform:scaleX(.18);transform-origin:left;transition:transform .6s var(--ease)}
.form-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(360px circle at var(--mx,-200px) var(--my,-200px),color-mix(in srgb,var(--fc) 10%,transparent),transparent 50%)}
.stagger.in>.form-card{transition:transform .5s var(--ease),box-shadow .5s var(--ease),opacity .9s}
.stagger.in>.form-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.form-card:hover::before{transform:scaleX(1)}
.fc-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--fc) 13%,#fff);color:var(--fc);font-size:22px;font-weight:800;flex:0 0 auto}
.fc-ico.sm{width:38px;height:38px;font-size:17px;border-radius:11px}.fc-ico.xs{width:26px;height:26px;font-size:13px;border-radius:8px}
.form-card h3{font-size:26px;margin-top:6px}
.form-card p{margin:0;color:var(--muted);font-size:15px;flex:1}
.fc-meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.fc-go{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--fc);margin-top:6px;transition:gap .3s var(--ease)}
.form-card:hover .fc-go{gap:9px}
.runner{min-height:80vh;background:linear-gradient(180deg,color-mix(in srgb,var(--fc) 6%,var(--foam)),var(--foam) 420px)}
.run-top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body:not(.mgmt) .run-top{top:68px}
.run-top .wrap{padding-top:12px;padding-bottom:12px}
.run-top .link-btn svg{transform:rotate(180deg)}
.run-bar{height:4px;background:#e6ecee}
.run-bar i{display:block;height:100%;background:var(--fc);border-radius:0 4px 4px 0;transition:width .7s var(--ease)}
.run-wrap{max-width:860px;padding-top:34px;padding-bottom:70px}
.run-steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.run-steps span{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 5px;transition:all .4s var(--ease)}
.run-steps i{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;background:#eef3f4}
.run-steps span.on{background:var(--fc);border-color:var(--fc);color:#fff}.run-steps span.on i{background:rgba(255,255,255,.25);color:#fff}
.run-steps span.done{color:var(--fc);border-color:color-mix(in srgb,var(--fc) 30%,#fff)}.run-steps span.done i{background:var(--fc);color:#fff}
.run-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 30px 70px -40px rgba(6,32,43,.4);animation:stepIn .55s var(--ease)}
@keyframes stepIn{from{opacity:0;transform:translateX(26px)}}
.prev-host .run-card{box-shadow:none;padding:24px}
.prev-host .runner{min-height:0;background:none}.prev-host .run-top{position:static}.prev-host .run-wrap{padding:16px 0 0}
.run-h{display:flex;gap:14px;align-items:center;margin-bottom:24px}
.run-h small{color:var(--muted);font-weight:700;font-size:13px}.run-h h2{font-family:var(--sans);font-size:26px;font-weight:780;letter-spacing:-.015em;color:var(--abyss)}
.qf{margin-bottom:22px;animation:slideUp .5s var(--ease) both}
.qf:nth-child(3){animation-delay:.05s}.qf:nth-child(4){animation-delay:.1s}.qf:nth-child(5){animation-delay:.15s}.qf:nth-child(n+6){animation-delay:.2s}
.ql{display:block;font-weight:750;font-size:15.5px;color:var(--abyss);margin-bottom:6px}
.req{color:#d6455a}
.help{display:block;color:var(--muted);font-size:13px;margin:-2px 0 8px}
.qf input:not([type=radio]):not([type=checkbox]):not([type=file]),.qf select,.qf textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;transition:border-color .25s,box-shadow .25s;font-size:15px}
.qf input:focus,.qf select:focus,.qf textarea:focus{outline:0;border-color:var(--fc);box-shadow:0 0 0 4px color-mix(in srgb,var(--fc) 14%,transparent)}
.qf textarea{min-height:120px;resize:vertical}
.qf .err{display:none;color:var(--bad);font-size:13px;font-weight:650;margin-top:6px}
.qf.invalid .err{display:block;animation:fade .3s}
.qf.invalid input,.qf.invalid select,.qf.invalid textarea,.qf.invalid .choices,.qf.invalid .sigpad,.qf.invalid .filedrop{border-color:var(--bad)!important;animation:shake .4s}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;border:1.5px solid transparent;border-radius:14px}
.choice{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:600;transition:border-color .25s,background .25s,transform .25s var(--ease)}
.choice:hover{border-color:color-mix(in srgb,var(--fc) 50%,var(--line))}
.choice input{position:absolute;opacity:0;width:0}
.choice .ck{width:20px;height:20px;border-radius:50%;border:2px solid #c3ced3;flex:0 0 20px;display:grid;place-items:center;transition:all .25s}
.choice .ck.sq{border-radius:6px}
.choice:has(input:checked){border-color:var(--fc);background:color-mix(in srgb,var(--fc) 7%,#fff)}
.choice input:checked+.ck{border-color:var(--fc);background:var(--fc);box-shadow:inset 0 0 0 3px #fff}
.choice input:checked+.ck.sq{box-shadow:none}
.choice input:checked+.ck.sq::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.choice input:focus-visible+.ck{outline:2.5px solid var(--brass);outline-offset:2px}
.filedrop{display:flex;align-items:center;gap:14px;border:1.5px dashed #c3ced3;border-radius:14px;padding:18px;cursor:pointer;transition:all .25s}
.filedrop:hover{border-color:var(--fc);background:color-mix(in srgb,var(--fc) 5%,#fff)}
.filedrop.has{border-style:solid;border-color:var(--fc);background:color-mix(in srgb,var(--fc) 6%,#fff)}
.fd-ico{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--fc) 14%,#fff);color:var(--fc);display:grid;place-items:center}
.fd-t{flex:1}.fd-t b{display:block}.fd-t small{color:var(--muted)}
.fd-thumb{width:64px;height:48px;object-fit:cover;border-radius:8px}
.sigpad{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:repeating-linear-gradient(0deg,#fff 0 34px,#f3f6f7 34px 35px)}
.sigpad canvas{width:100%;height:160px;display:block;touch-action:none;cursor:crosshair}
.sig-tools{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);background:#fff}
.sigpad.signed{border-color:var(--fc)}
.run-f{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);margin-top:10px;padding-top:20px}
.runner .btn-primary{background:var(--fc);color:#fff;box-shadow:0 12px 26px -12px color-mix(in srgb,var(--fc) 80%,transparent)}
.review .rv-sec{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.rv-row{display:grid;grid-template-columns:1fr 1.2fr;gap:12px;padding:7px 0;border-top:1px dashed #edf1f3;font-size:14.5px}
.rv-row span:first-child{color:var(--muted)}
.sig-img{max-height:60px;max-width:220px}
/* admin: forms + builder */
.fb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.fb-card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.fb-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--fc)}
.stagger.in>.fb-card{transition:transform .4s var(--ease),box-shadow .4s var(--ease),opacity .6s}
.stagger.in>.fb-card:hover{transform:translateY(-3px);box-shadow:0 22px 44px -26px rgba(6,32,43,.5)}
.fb-top{display:flex;justify-content:space-between;align-items:center}
.fb-card h3{font-family:var(--sans);font-size:17px;font-weight:750;margin:12px 0 4px}
.fb-card p{margin:0;color:var(--mu);font-size:13.5px;min-height:38px}
.fb-stats{display:flex;gap:16px;font-size:13px;color:var(--mu);margin:12px 0}.fb-stats b{color:#0f1e26}
.fb-actions{display:flex;gap:8px}
.answers .ans{display:grid;grid-template-columns:1fr 1.3fr;gap:12px;padding:8px 0;border-bottom:1px dashed #edf1f3;font-size:14px}
.answers .ans:last-child{border:0}.answers .ans>span{color:#6b7c86}
.file-chip{display:inline-flex;align-items:center;gap:8px;background:#f4f7f8;border-radius:10px;padding:6px 10px;font-weight:650}
.file-chip img{width:34px;height:26px;object-fit:cover;border-radius:5px}.file-chip small{color:#6b7c86;font-weight:500}
.bld{margin:-28px -30px -120px;min-height:calc(100vh - 62px);display:flex;flex-direction:column}
.bld-top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:62px;z-index:5}
.bld-top .icon-btn svg{transform:rotate(180deg)}
.bld-name{border:1.5px solid transparent;border-radius:10px;padding:7px 10px;font-weight:750;font-size:17px;min-width:200px;transition:border-color .2s;background:none}
.bld-name:hover{border-color:var(--bd)}.bld-name:focus{outline:0;border-color:var(--tide)}
.bld-grid{display:grid;grid-template-columns:250px 1fr 300px;flex:1;min-height:0}
@media (max-width:1150px){.bld-grid{grid-template-columns:1fr}.bld-pal,.bld-insp{border:0!important}}
.bld-pal,.bld-insp{background:#fff;padding:18px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.bld-pal{border-right:1px solid var(--bd)}.bld-insp{border-left:1px solid var(--bd)}
.bld-pal>small,.bld-insp>small{color:var(--mu);margin-bottom:10px}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal-it{display:flex;align-items:center;gap:7px;border:1px solid var(--bd);background:#fafcfc;border-radius:10px;padding:8px;font-size:12.5px;font-weight:650;cursor:grab;text-align:left;transition:all .2s var(--ease)}
.pal-it i{font-style:normal;width:22px;height:22px;border-radius:6px;background:#06202b;color:#fff;display:grid;place-items:center;font-size:12px;flex:0 0 22px}
.pal-it:hover{border-color:var(--tide);transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(6,32,43,.3)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--bd);cursor:pointer;transition:transform .2s}
.sw.on{box-shadow:0 0 0 2px #0f1e26;transform:scale(1.1)}
.bld-canvas{padding:26px;overflow:auto;background:#f4f6f7}
.bc-head{background:#fff;border-radius:18px 18px 0 0;border:1px solid var(--bd);border-top:5px solid var(--fc);padding:20px 22px;max-width:720px;margin:0 auto}
.bc-head h2{font-family:var(--sans);font-size:22px;font-weight:780}.bc-head p{margin:4px 0 0;color:var(--mu)}
.bc-list{max-width:720px;margin:0 auto;background:#fff;border:1px solid var(--bd);border-top:0;border-radius:0 0 18px 18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.bf{display:flex;align-items:center;gap:10px;border:1.5px solid transparent;background:#fafcfc;border-radius:12px;padding:10px 10px 10px 6px;cursor:pointer;transition:border-color .2s,background .2s,box-shadow .2s,opacity .2s;position:relative}
.bf:hover{border-color:#dbe4e7}
.bf.sel{border-color:var(--tide);background:#f1f9f8;box-shadow:0 0 0 4px rgba(30,143,135,.1)}
.bf.dragging{opacity:.35}
.bf.drop-before::before{content:"";position:absolute;left:6px;right:6px;top:-5px;height:3px;border-radius:3px;background:var(--tide)}
.bf.pop{animation:pop .5s var(--ease)}
.bf.page{background:none;border-style:dashed;border-color:#dbe4e7;justify-content:space-between}
.pg-l{flex:1;font-size:12.5px;font-weight:750;color:var(--mu)}
.grip{color:#b3c0c5;cursor:grab;font-size:13px;letter-spacing:-2px;padding:0 2px}
.bf-type{width:30px;height:30px;border-radius:9px;background:#06202b;color:#fff;display:grid;place-items:center;font-size:14px;flex:0 0 30px}
.bf-b{flex:1;min-width:0}.bf-b b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bf-b small{color:var(--mu);font-size:12px}
.bc-drop{border:1.5px dashed #c9d4d8;border-radius:12px;padding:16px;text-align:center;color:var(--mu);font-size:13px;transition:all .2s;margin-top:4px}
.bc-drop.over{border-color:var(--tide);background:#eef8f7;color:var(--tide)}
.insp-empty{text-align:center;color:var(--mu);padding:40px 10px}.insp-empty svg{margin:0 auto 10px;opacity:.5}.insp-empty b{display:block;color:#0f1e26;margin-bottom:4px}.insp-empty p{font-size:13px}
.bld-insp .field label{font-size:12.5px}
</style>
</head>

<script>"use strict";
/* ============ Harbor Point Residences — demo portal (fictional data only) ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = c => (c / 100).toLocaleString("en-US", {style:"currency", currency:"USD"});
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fee = sub => sub > 0 ? Math.round(sub * 29 / 1000) + 30 : 0;
const ORDER_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const orderNo = () => "HP-" + Array.from({length:5}, () => ORDER_ALPHABET[Math.floor(Math.random() * 32)]).join("");

/* ---------- storage (safe) ---------- */
const STORE_KEY = "hp-demo-v1";
const mem = {};
function load(key, fallback) {
  try { const raw = localStorage.getItem(`${STORE_KEY}:${key}`); if (raw) return JSON.parse(raw); } catch (_) {}
  return key in mem ? mem[key] : fallback;
}
function save(key, value) {
  mem[key] = value;
  try { localStorage.setItem(`${STORE_KEY}:${key}`, JSON.stringify(value)); } catch (_) {}
}
function wipe() {
  Object.keys(mem).forEach(k => delete mem[k]);
  try { Object.keys(localStorage).filter(k => k.startsWith(STORE_KEY)).forEach(k => localStorage.removeItem(k)); } catch (_) {}
}

/* ---------- art: generated SVG scenes (no photos) ---------- */
const PALETTES = {
  dusk:["#06202b","#1e8f87","#c8a15a","#f1dcae"], day:["#8fd0d2","#dff1ee","#1e8f87","#f3f7f6"],
  night:["#041821","#0d3a4a","#c8a15a","#f1dcae"], sand:["#e7eff0","#d6e3e4","#1e8f87","#c8a15a"],
  sea:["#164c5c","#2a7f86","#9fd3d6","#f4efe6"], coral:["#c8a15a","#f1dcae","#06202b","#fff"]
};
function scene(kind, pal = "dusk", seed = 1) {
  const [a, b, c, d] = PALETTES[pal] || PALETTES.dusk;
  const id = "g" + seed + kind;
  let rnd = seed * 9301 + 49297; const r = () => ((rnd = (rnd * 9301 + 49297) % 233280) / 233280);
  const sky = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".65" stop-color="${b}"/><stop offset="1" stop-color="${d}"/></linearGradient></defs><rect width="600" height="400" fill="url(#${id})"/>`;
  const sun = `<circle cx="${380 + r() * 120}" cy="${110 + r() * 60}" r="${34 + r() * 20}" fill="${c}" opacity=".9"/>`;
  const water = `<g class="wave"><path d="M0 300 Q 75 285 150 300 T 300 300 T 450 300 T 600 300 T 750 300 V400 H0Z" fill="${b}" opacity=".85"/><path d="M0 330 Q 75 318 150 330 T 300 330 T 450 330 T 600 330 T 750 330 V400 H0Z" fill="${a}" opacity=".55"/></g>`;
  const tower = (x, w, h, col) => { let win = ""; for (let y = 400 - h + 14; y < 290; y += 16) for (let wx = x + 7; wx < x + w - 8; wx += 12) if (r() > .35) win += `<rect x="${wx}" y="${y}" width="5" height="7" fill="${d}" opacity="${.35 + r() * .5}"/>`; return `<rect x="${x}" y="${400 - h}" width="${w}" height="${h}" fill="${col}"/>${win}`; };
  const skyline = () => { let s = ""; let x = 0; while (x < 600) { const w = 40 + r() * 50, h = 120 + r() * 170; s += tower(x, w, h, a); x += w + 4; } return s; };
  const palm = (x, s = 1) => `<g transform="translate(${x} ${300 - 120 * s}) scale(${s})" fill="${a}"><path d="M8 0 C 14 40 4 80 10 120 L 2 120 C -2 80 6 40 0 0Z"/><path d="M4 0 C -30 -10 -50 10 -60 30 C -30 10 -10 8 4 4Z"/><path d="M4 0 C 40 -12 60 8 70 28 C 40 10 18 8 4 4Z"/><path d="M4 0 C -10 -30 -40 -40 -55 -30 C -30 -26 -12 -14 4 2Z"/><path d="M4 0 C 20 -32 48 -38 62 -26 C 40 -24 20 -12 4 2Z"/></g>`;
  const scenes = {
    skyline: sky + sun + skyline() + water,
    pool: sky + sun + `<rect y="250" width="600" height="150" fill="${d}"/><rect x="60" y="280" width="480" height="90" rx="14" fill="${b}"/><g class="wave"><path d="M60 300 Q 120 292 180 300 T 300 300 T 420 300 T 540 300 T 660 300" stroke="#fff" stroke-width="3" fill="none" opacity=".6"/><path d="M60 330 Q 120 322 180 330 T 300 330 T 420 330 T 540 330 T 660 330" stroke="#fff" stroke-width="3" fill="none" opacity=".4"/></g>` + palm(40, .9) + palm(540, 1.1) + `<rect x="200" y="235" width="60" height="10" rx="5" fill="${c}"/><rect x="330" y="235" width="60" height="10" rx="5" fill="${c}"/>`,
    gym: `<rect width="600" height="400" fill="${a}"/><rect y="300" width="600" height="100" fill="${b}"/>` + [0,1,2,3].map(i => `<rect x="${60 + i * 130}" y="60" width="100" height="200" fill="${d}" opacity=".18"/>`).join("") + `<g fill="${c}"><rect x="140" y="240" width="320" height="10" rx="5"/><rect x="120" y="215" width="22" height="60" rx="6"/><rect x="458" y="215" width="22" height="60" rx="6"/></g><circle cx="300" cy="330" r="22" fill="${d}" opacity=".5"/>`,
    lounge: `<rect width="600" height="400" fill="${d}"/><rect y="290" width="600" height="110" fill="${b}" opacity=".5"/><rect x="70" y="60" width="200" height="150" fill="${a}" opacity=".8"/><rect x="330" y="60" width="200" height="150" fill="${a}" opacity=".8"/>` +`<rect x="120" y="240" width="360" height="60" rx="18" fill="${c}"/><rect x="120" y="215" width="360" height="40" rx="14" fill="${a}"/><circle cx="470" cy="180" r="10" fill="${c}"/><rect x="466" y="190" width="8" height="70" fill="${a}"/>`,
    rooftop: sky + sun + `<rect y="280" width="600" height="120" fill="${a}"/>` + [80, 230, 380].map(x => `<g><rect x="${x}" y="230" width="110" height="10" rx="5" fill="${c}"/><rect x="${x + 50}" y="160" width="6" height="70" fill="${d}"/><path d="M${x - 5} 165 L ${x + 53} 140 L ${x + 115} 165Z" fill="${d}"/></g>`).join("") + `<path d="M0 280 H600" stroke="${d}" stroke-width="4" stroke-dasharray="2 10"/>`,
    lobby: `<rect width="600" height="400" fill="${d}"/><rect y="320" width="600" height="80" fill="${b}" opacity=".6"/>` + [0,1,2,3,4].map(i => `<rect x="${40 + i * 115}" y="40" width="20" height="280" fill="${a}" opacity=".85"/>`).join("") + `<rect x="210" y="250" width="180" height="70" rx="8" fill="${a}"/><rect x="230" y="236" width="140" height="14" rx="4" fill="${c}"/><circle cx="300" cy="120" r="46" fill="${c}" opacity=".85"/>`,
    marina: sky + sun + `<rect y="300" width="600" height="100" fill="${b}"/>` + [60, 220, 390].map((x, i) => `<g class="wave"><path d="M${x} 300 L ${x + 120} 300 L ${x + 100} 325 L ${x + 20} 325Z" fill="${d}"/><rect x="${x + 58}" y="${200 - i * 10}" width="4" height="${100 + i * 10}" fill="${a}"/><path d="M${x + 62} ${205 - i * 10} L ${x + 110} 290 L ${x + 62} 290Z" fill="${d}" opacity=".9"/></g>`).join("") + water,
    garden: sky + `<rect y="270" width="600" height="130" fill="${b}"/>` + palm(90, 1) + palm(250, .8) + palm(470, 1.2) + `<path d="M0 330 C 150 300 300 360 600 320 V400 H0Z" fill="${a}" opacity=".7"/>`,
    package: `<rect width="600" height="400" fill="${d}"/>` + [[150,170,120],[290,190,100],[230,110,90],[380,150,90]].map(([x,y,s]) => `<rect x="${x}" y="${y}" width="${s}" height="${s * .8}" rx="6" fill="${c}"/><rect x="${x + s / 2 - 8}" y="${y}" width="16" height="${s * .8}" fill="${a}" opacity=".35"/>`).join(""),
    key: `<rect width="600" height="400" fill="${d}"/><circle cx="230" cy="200" r="70" fill="none" stroke="${a}" stroke-width="26"/><rect x="290" y="188" width="200" height="26" rx="8" fill="${a}"/><rect x="430" y="214" width="20" height="40" rx="4" fill="${a}"/><rect x="465" y="214" width="20" height="30" rx="4" fill="${a}"/><circle cx="230" cy="200" r="20" fill="${c}"/>`,
    tool: `<rect width="600" height="400" fill="${d}"/><g transform="rotate(-35 300 200)"><rect x="150" y="185" width="300" height="30" rx="15" fill="${a}"/><circle cx="455" cy="200" r="48" fill="${a}"/><rect x="440" y="150" width="30" height="40" fill="${d}"/></g><circle cx="170" cy="300" r="16" fill="${c}"/>`,

/* ---------- reservations ---------- */
const resState = {step:1, amenity:null, date:null, start:null, guests:2, notes:"", month:null, rules:false};
const myTokens = () => load("myReservations", []);
function reservationsFor(amenityId, date) { return load("reservations", []).filter(r => r.amenity === amenityId && r.date === date && !["declined","cancelled"].includes(r.status)); }
function slotTaken(a, date, start, hours) { return reservationsFor(a.id, date).some(r => start < r.start + r.hours && r.start < start + hours); }
function durationFor(a) { return a.id === "gym" ? 1 : 3; }
function pageReservations(v) {
  if (!resState.month) { const d = new Date(); resState.month = new Date(d.getFullYear(), d.getMonth(), 1); }
  const a = AMENITIES.find(x => x.id === resState.amenity);
  const stepNames = ["step1","step2","step3","step4"];
  v.innerHTML = `<div class="wrap page-head"><div class="eyebrow">${esc(t("nav_res"))}</div><h1>${esc(t("res_title"))}</h1><p>${esc(t("res_sub"))}</p></div>
  <div class="wrap grid" style="grid-template-columns:minmax(0,1fr);gap:28px">
    <div><div class="steps">${stepNames.map((s, i) => `<span class="${i + 1 < resState.step ? "done" : i + 1 === resState.step ? "on" : ""}">${esc(t(s))}</span>`).join("")}</div><div id="resStep"></div></div>

      <div class="small"><b>${esc(t("capacity", {n:x.cap}))}</b> · ${esc(t("hours", {o:hourLabel(x.open), c:hourLabel(x.close)}))}</div>
      <div class="small muted">${esc(t("res_fee"))}: ${x.fee ? money(x.fee) : esc(t("none"))}</div></div></button>`).join("")}</div>`;
    $$("[data-am]", box).forEach(b => b.onclick = () => { resState.amenity = b.dataset.am; resState.date = null; resState.start = null; resState.step = 2; pageReservations(v); });
  } else if (resState.step === 2) {
    const m = resState.month; const first = new Date(m.getFullYear(), m.getMonth(), 1); const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    const minDate = addDays(new Date(), 1); minDate.setHours(0, 0, 0, 0); const maxDate = addDays(new Date(), 90);
    const dows = LANG === "es" ? ["D","L","M","M","J","V","S"] : ["S","M","T","W","T","F","S"];
    let cells = dows.map(d => `<div class="dow">${d}</div>`).join("") + Array(first.getDay()).fill("<div></div>").join("");
    for (let d = 1; d <= days; d++) { const dt = new Date(m.getFullYear(), m.getMonth(), d); const key = ymd(dt); const dis = dt < minDate || dt > maxDate; const busy = reservationsFor(a.id, key).length > 0;
      cells += `<button type="button" class="day ${resState.date === key ? "sel" : ""} ${busy && !dis ? "busy" : ""}" data-day="${key}" ${dis ? "disabled" : ""}>${d}</button>`; }
    const dur = durationFor(a);
    const slots = []; for (let h = a.open; h + dur <= a.close; h++) slots.push(h);
    box.innerHTML = `<div class="grid g2" style="align-items:start"><div class="cal"><div class="cal-head"><button class="pill-btn" type="button" id="prevM">‹</button><b>${esc(m.toLocaleDateString(LANG === "es" ? "es-US" : "en-US", {month:"long", year:"numeric"}))}</b><button class="pill-btn" type="button" id="nextM">›</button></div><div class="cal-grid">${cells}</div>
      <p class="small muted" style="margin:10px 0 0"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral)"></span> = existing bookings that day</p></div>
      <div class="card"><h3>${esc(aName(a))}</h3><p class="small muted">${esc(t("hours", {o:hourLabel(a.open), c:hourLabel(a.close)}))} · ${dur}h</p>
      ${resState.date ? `<b class="small">${esc(dateLabel(resState.date, {weekday:"long", month:"long", day:"numeric"}))}</b><div class="slots" style="margin-top:10px">${slots.map(h => { const taken = slotTaken(a, resState.date, h, dur); return `<button type="button" class="slot ${resState.start === h ? "on" : ""}" data-slot="${h}" ${taken ? `disabled title="${esc(t("booked"))}"` : ""}>${hourLabel(h)}</button>`; }).join("")}</div>` : `<p class="muted">${esc(t("pick_date"))}</p>`}
      <div class="row" style="margin-top:18px"><button class="btn btn-ghost btn-sm" type="button" id="back1">${esc(t("back"))}</button><button class="btn btn-primary btn-sm" type="button" id="next2" ${resState.start == null ? "disabled" : ""}>${esc(t("next"))}</button></div></div></div>`;
    $("#prevM").onclick = () => { resState.month = new Date(m.getFullYear(), m.getMonth() - 1, 1); pageReservations(v); };
    $("#nextM").onclick = () => { resState.month = new Date(m.getFullYear(), m.getMonth() + 1, 1); pageReservations(v); };

      <div class="two"><div class="field"><label for="f-guests">${esc(t("guests"))}</label><input id="f-guests" type="number" min="1" max="${a.cap}" value="${Math.min(resState.guests, a.cap)}"><span class="small muted">${esc(t("capacity", {n:a.cap}))}</span></div>
      <div class="field"><label>${esc(t("deposit"))}</label><div id="depShow" class="price" style="padding:10px 0"></div></div></div>
      <div class="field"><label for="f-notes">${esc(t("notes"))}</label><textarea id="f-notes" maxlength="500">${esc(resState.notes)}</textarea></div>
      <div class="row"><button class="btn btn-ghost btn-sm" type="button" id="back2">${esc(t("back"))}</button><button class="btn btn-primary btn-sm" type="submit">${esc(t("next"))}</button></div></form>`;
    const showDep = () => { const g = Math.max(1, Math.min(a.cap, parseInt($("#f-guests").value, 10) || 1)); const d = depositFor(a, g); $("#depShow").textContent = d ? money(d) : t("none"); };
    showDep(); $("#f-guests").oninput = showDep;
    $("#back2").onclick = () => { resState.step = 2; pageReservations(v); };
    $("#resForm").onsubmit = e => { e.preventDefault(); const who = validResident(); if (!who) return; resState.who = who; resState.guests = Math.max(1, Math.min(a.cap, parseInt($("#f-guests").value, 10) || 1)); resState.notes = $("#f-notes").value.slice(0, 500); save("residentDraft", who); resState.step = 4; pageReservations(v); };
  } else {
    const dep = depositFor(a, resState.guests); const w = resState.who;
    box.innerHTML = `<div class="card" style="max-width:760px"><h3>${esc(aName(a))}</h3>
      <div class="facts"><div><span>${esc(t("pick_date"))}</span>${esc(dateLabel(resState.date, {weekday:"short", month:"short", day:"numeric", year:"numeric"}))}</div><div><span>${esc(t("pick_time"))}</span>${hourLabel(resState.start)} – ${hourLabel(resState.start + durationFor(a))}</div>
      <div><span>${esc(t("guests"))}</span>${resState.guests}</div><div><span>${esc(t("unit"))}</span>${esc(w.unit)} · ${esc(w.name)}</div>
      <div><span>${esc(t("res_fee"))}</span>${a.fee ? money(a.fee) : esc(t("none"))}</div><div><span>${esc(t("deposit"))}</span>${dep ? money(dep) : esc(t("none"))}</div></div>
      ${dep ? `<p class="small muted">${esc(t("deposit_note"))}</p>` : ""}
      <label class="check"><input type="checkbox" id="rulesOk"><span>${esc(t("rules"))}</span></label><div class="field" data-f="rules"><span class="err">${esc(t("err_terms"))}</span></div>
      <div class="row"><button class="btn btn-ghost btn-sm" type="button" id="back3">${esc(t("back"))}</button><button class="btn btn-primary" type="button" id="submitRes">${esc(t("submit_res"))}</button></div></div>`;
    $("#back3").onclick = () => { resState.step = 3; pageReservations(v); };
    $("#submitRes").onclick = () => {
      if (setErr("rules", !$("#rulesOk").checked)) return;
      if (slotTaken(a, resState.date, resState.start, durationFor(a))) { toast("That time was just booked. Please pick another."); resState.step = 2; return pageReservations(v); }
      const list = load("reservations", []);
      const ref = "R-" + (4100 + list.length + Math.floor(Math.random() * 800));
      const r = {id:uid(), ref, token:uid(), amenity:a.id, date:resState.date, start:resState.start, hours:durationFor(a), guests:resState.guests, ...w, status:"pending", fee:a.fee, deposit:dep, depositStatus:"none", created:new Date().toISOString(), notes:resState.notes};

      sendDemoEmail("management@harborpoint-demo.com", `New reservation request ${r.ref}`, `${r.name} (Unit ${r.unit}) requested the ${a.name}.\nDate: ${dateLabel(r.date)} ${hourLabel(r.start)}–${hourLabel(r.start + r.hours)}\nGuests: ${r.guests}\nNotes: ${r.notes || "—"}\n\nReview it in the Management dashboard.`, "Management");

function renderMyReservations(v) {
  const mine = myTokens(); const list = load("reservations", []).filter(r => mine.includes(r.token));
  const box = $("#myRes");

  box.innerHTML = `<div class="stack">${list.map(r => { const a = AMENITIES.find(x => x.id === r.amenity); const cls = {pending:"b-warn",approved:"b-coral",deposit_paid:"b-ok",completed:"b-gray",declined:"b-bad",cancelled:"b-gray"}[r.status];
    return `<div class="card res-card"><div><b>${esc(aName(a))}</b> <span class="badge ${cls}">${esc(t("r_" + r.status))}</span><div class="small muted">${esc(r.ref)} · ${esc(dateLabel(r.date))} · ${hourLabel(r.start)} · ${r.guests} ${esc(t("guests").toLowerCase())}</div></div>
    <div class="row">${r.status === "approved" && r.deposit ? `<button class="btn btn-primary btn-sm" type="button" data-dep="${r.id}">${esc(t("pay_deposit"))} · ${money(r.deposit)}</button>` : ""}${["pending","approved","deposit_paid"].includes(r.status) ? `<button class="btn btn-danger btn-sm" type="button" data-cx="${r.id}">${esc(t("cancel"))}</button>` : ""}</div></div>`; }).join("")}</div>`;
  $$("[data-cx]", box).forEach(b => b.onclick = () => { updateReservation(b.dataset.cx, r => { r.status = "cancelled"; if (r.depositStatus === "held") r.depositStatus = "released"; }); sendDemoEmail(list.find(x => x.id === b.dataset.cx).email, "Reservation cancelled", "Your reservation has been cancelled. Any deposit hold has been released."); toast(t("cancelled")); pageReservations(v); });
  $$("[data-dep]", box).forEach(b => b.onclick = () => depositCheckout(b.dataset.dep, v));
}
function updateReservation(id, fn) { const list = load("reservations", []); const r = list.find(x => x.id === id); if (r) { fn(r); save("reservations", list); } return r; }
function depositCheckout(id, v) {
  const r = load("reservations", []).find(x => x.id === id); const a = AMENITIES.find(x => x.id === r.amenity);
  openModal(`<h3>${esc(t("pay_deposit"))} · ${money(r.deposit)}</h3><p class="small muted">${esc(aName(a))} · ${esc(r.ref)} · ${esc(t("deposit_note"))}</p>
    <form id="depForm" novalidate><div class="alert alert-info small" style="margin-bottom:12px">${esc(t("test_card"))}</div>${field("card", t("card"), "text", "", "err_card", 'inputmode="numeric" placeholder="4242 4242 4242 4242" maxlength="19"')}
    <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">${icon("lock", 16)} ${esc(t("pay_deposit"))}</button></form>`);
  $("#depForm").onsubmit = e => { e.preventDefault(); if (setErr("card", $("#f-card").value.replace(/\D/g, "") !== "4242424242424242")) return;

    closeModal(); toast(t("deposit_done")); pageReservations(v); };
}

let chatSession = null;
function chatAnswer(text) {
  const q = " " + text.toLowerCase() + " ";
  const spanish = LANG === "es" || /[¿¡ñ]|\b(donde|dónde|cuando|cuándo|cómo|como|quiero|puedo|tengo|hola|gracias|piscina|paquete)\b/.test(q);
  let best = null, score = 0;
  KB.forEach(e => { const s = e.k.reduce((a, k) => a + (q.includes(k) ? k.length : 0), 0); if (s > score) { score = s; best = e; } });
  if (best) return spanish ? best.es : best.en;
  return spanish ? "No tengo esa respuesta todavía. La recepción puede ayudarle 24/7 al (555) 010-0199, o envíe un mensaje en la página de Comentarios." : "I don't have that answer yet. The front desk can help 24/7 at (555) 010-0199, or send a note on the Feedback page.";
}

function chatBubble(who, text) { const d = document.createElement("div"); d.className = "msg " + who; d.textContent = text; $("#chatBody").appendChild(d); $("#chatBody").scrollTop = 1e6; return d; }
function openChat() { $("#chat").classList.add("open"); renderChatChrome(); setTimeout(() => $("#chatInput").focus(), 50); const dot = $(".chat-fab .dot"); if (dot) dot.remove(); }
function chatSend(text) {
  text = String(text || "").trim().slice(0, 500); if (!text) return;
  chatBubble("me", text); $("#chatInput").value = "";
  const typing = chatBubble("bot typing", "Aria is typing…");
  setTimeout(() => {
    typing.remove(); const answer = chatAnswer(text); chatBubble("bot", answer);
    const chats = load("chats", []);
    if (!chatSession) { chatSession = {id:uid(), date:new Date().toISOString(), lang:LANG, status:"Unreviewed", messages:[]}; chats.unshift(chatSession); }
    const s = chats.find(c => c.id === chatSession.id) || chatSession; if (!chats.includes(s)) chats.unshift(s);
    s.messages.push({who:"me", text}, {who:"bot", text:answer}); chatSession = s; save("chats", chats.slice(0, 100));
  }, 650);
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const AMEN_COLOR = {party:"#8b5cf6", cabana:"#0ea5e9", rooftop:"#c8a15a", gym:"#1e8f87"};
function monthsBack(n) { const d = new Date(); d.setDate(1); return Array.from({length:n}, (_, i) => { const x = new Date(d.getFullYear(), d.getMonth() - (n - 1 - i), 1); return {y:x.getFullYear(), m:x.getMonth(), label:MONTHS[x.getMonth()]}; }); }
function revenueByMonth(months, orders = load("orders", [])) { const paid = orders.filter(o => o.payment === "Paid"); return months.map(({y, m}) => paid.filter(o => { const d = new Date(o.date); return d.getFullYear() === y && d.getMonth() === m; }).reduce((a, o) => a + o.total, 0)); }
function sumRange(list, from, to, f) { return list.filter(x => { const d = new Date(x.date); return d >= from && d < to; }).reduce((a, x) => a + f(x), 0); }
function trend(cur, prev) { if (!prev) return cur ? {txt:"New", up:true} : {txt:"0%", up:true}; const p = Math.round((cur - prev) / prev * 100); return {txt:`${p > 0 ? "+" : ""}${p}%`, up:p >= 0}; }
function spark(vals, color) {
  const max = Math.max(...vals, 1), w = 120, h = 36, step = w / (vals.length - 1 || 1);
  const pts = vals.map((v, i) => [i * step, h - 4 - v / max * (h - 8)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const id = "sp" + Math.random().toString(36).slice(2, 7);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#${id})" class="spark-area"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw"/></svg>`;
}
function areaChart(vals, labels, color = "#1e8f87") {
  const W = 680, H = 240, pad = {l:48, r:12, t:16, b:28}; const max = Math.max(...vals, 1) * 1.15;
  const x = i => pad.l + i * (W - pad.l - pad.r) / (vals.length - 1 || 1), y = v => pad.t + (1 - v / max) * (H - pad.t - pad.b);
  const pts = vals.map((v, i) => [x(i), y(v)]);
  const line = pts.map((p, i) => { if (!i) return `M${p[0]} ${p[1]}`; const q = pts[i - 1]; const cx = (q[0] + p[0]) / 2; return `C${cx} ${q[1]} ${cx} ${p[1]} ${p[0]} ${p[1]}`; }).join(" ");
  const grid = [0, .25, .5, .75, 1].map(f => { const v = max * f; return `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pad.l - 8}" y="${y(v) + 4}" text-anchor="end" class="gt">$${Math.round(v / 100).toLocaleString()}</text>`; }).join("");
  return `<div class="area-wrap" data-vals="${vals.join(",")}" data-labels="${labels.join(",")}"><svg viewBox="0 0 ${W} ${H}" class="area" role="img" aria-label="Revenue chart"><defs><linearGradient id="agrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".26"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}
    <path d="${line} L${x(vals.length - 1)} ${H - pad.b} L${pad.l} ${H - pad.b}Z" fill="url(#agrad)" class="area-fill"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" pathLength="1" class="draw slow"/>
    ${labels.map((l, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" class="gt">${l}</text>`).join("")}
    <line class="guide" y1="${pad.t}" y2="${H - pad.b}" x1="0" x2="0"/>${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" class="pt" data-i="${i}" style="--i:${i}"/>`).join("")}</svg><div class="tip" hidden></div></div>`;
}
function wireArea(root) {
  $$(".area-wrap", root).forEach(w => { const svg = $("svg", w), tip = $(".tip", w), vals = w.dataset.vals.split(",").map(Number), labels = w.dataset.labels.split(","), pts = $$(".pt", w), guide = $(".guide", w);
    svg.onpointermove = e => { const r = svg.getBoundingClientRect(); const sx = (e.clientX - r.left) / r.width * 680; let best = 0, bd = 1e9; pts.forEach((p, i) => { const d = Math.abs(+p.getAttribute("cx") - sx); if (d < bd) { bd = d; best = i; } });
      const p = pts[best]; pts.forEach(q => q.classList.toggle("on", q === p)); guide.setAttribute("x1", p.getAttribute("cx")); guide.setAttribute("x2", p.getAttribute("cx")); guide.classList.add("on");
      tip.hidden = false; tip.innerHTML = `<small>${labels[best]}</small><b>${money(vals[best])}</b>`; tip.style.left = (+p.getAttribute("cx") / 680 * r.width) + "px"; tip.style.top = (+p.getAttribute("cy") / 240 * r.height) + "px"; };
    svg.onpointerleave = () => { tip.hidden = true; guide.classList.remove("on"); pts.forEach(q => q.classList.remove("on")); }; });
}
function donut(segs, center, sub) {
  const total = segs.reduce((a, s) => a + s.v, 0) || 1; let off = 25;
  const circles = segs.map(s => { const pct = s.v / total * 100; const c = `<circle r="15.915" cx="21" cy="21" fill="none" stroke="${s.c}" stroke-width="5" pathLength="100" stroke-dasharray="0 100" data-da="${Math.max(0, pct - .6)} ${100 - Math.max(0, pct - .6)}" stroke-dashoffset="${off}" class="dseg"/>`; off -= pct; return c; }).join("");
  return `<div class="donut"><svg viewBox="0 0 42 42"><circle r="15.915" cx="21" cy="21" fill="none" stroke="#edf2f4" stroke-width="5"/>${circles}</svg><div class="donut-c"><b>${center}</b><small>${sub}</small></div></div>
    <div class="legend">${segs.map(s => `<div><i style="background:${s.c}"></i><span>${esc(s.l)}</span><b>${s.fmt || s.v}</b></div>`).join("")}</div>`;
}
function wireDonuts(root) { requestAnimationFrame(() => setTimeout(() => $$(".dseg", root).forEach((c, i) => { c.style.transitionDelay = (i * 120) + "ms"; c.setAttribute("stroke-dasharray", c.dataset.da); }), 60)); }
function kpiCard(k, label, value, t, sparkVals, color) {

    $("#iLabel").oninput = e => { upd(x => x.label = e.target.value); refreshRow(); };
    const h = $("#iHelp"); if (h) h.oninput = e => upd(x => x.help = e.target.value);
    const rq = $("#iReq"); if (rq) rq.onchange = e => { upd(x => x.required = e.target.checked); refreshRow(); };
    const op = $("#iOpts"); if (op) op.onchange = e => { upd(x => x.options = e.target.value.split("\n").map(s => s.trim()).filter(Boolean)); renderBuilder(body); };
    const cd = $("#iCond"); if (cd) cd.onchange = e => { const v = e.target.value; upd(x => { if (!v) delete x.showIf; else { const src = formById(form.id).fields.find(c => c.id === v); x.showIf = {field:v, equals:src.options[0]}; } }); renderBuilder(body); };
    const eq = $("#iEq"); if (eq) eq.onchange = e => upd(x => { if (x.showIf) x.showIf.equals = e.target.value; });
  }
}

/* ---------- boot ---------- */
function boot() {
  ensureSeed();
  LANG = load("lang", "en") === "es" ? "es" : "en";
  $("#brandLogo").innerHTML = LOGO;
  renderShell();
  $("#langBtn").onclick = () => { LANG = LANG === "en" ? "es" : "en"; save("lang", LANG); renderShell(); $("#chatBody").innerHTML = ""; if ($("#chat").classList.contains("open")) renderChatChrome(); route(); renderDrawer(); };
  $("#cartBtn").onclick = () => { renderDrawer(); openDrawer(); };
  $("#drawerClose").onclick = closeDrawer; $("#scrim").onclick = closeDrawer;
  $("#menuBtn").onclick = () => $("#navLinks").classList.toggle("open");
  $("#resetBtn").onclick = () => confirmReset();
  $("#chatFab").onclick = () => $("#chat").classList.contains("open") ? $("#chat").classList.remove("open") : openChat();
  $("#chatClose").onclick = () => $("#chat").classList.remove("open");
  $("#chatForm").onsubmit = e => { e.preventDefault(); chatSend($("#chatInput").value); };
  $("#modal .x").onclick = closeModal;
  $("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
  $("#lbClose").onclick = () => $("#lightbox").classList.remove("open");
  $("#lbPrev").onclick = () => openLightbox(lbIdx - 1); $("#lbNext").onclick = () => openLightbox(lbIdx + 1);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeModal(); closeDrawer(); $("#lightbox").classList.remove("open"); $("#chat").classList.remove("open"); }
    if ($("#lightbox").classList.contains("open")) { if (e.key === "ArrowLeft") openLightbox(lbIdx - 1); if (e.key === "ArrowRight") openLightbox(lbIdx + 1); }
  });
  const clearErr = e => { const f = e.target.closest && e.target.closest(".field"); if (f) f.classList.remove("invalid"); const map = {terms:"terms", autoAuth:"autoAuth", rulesOk:"rules"}; if (map[e.target.id]) setErr(map[e.target.id], false); };
  document.addEventListener("input", clearErr); document.addEventListener("change", clearErr);
  window.addEventListener("hashchange", route);
  route();
}
document.addEventListener("DOMContentLoaded", boot);
</script>
